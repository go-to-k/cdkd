allowBuilds:
  esbuild: true
  # Transitive via @mermaid-js/mermaid-cli (an ox-content dependency); no docs
  # page uses mermaid, and the OG renderer runs on playwright (whose Chromium
  # CI installs explicitly) — so skip puppeteer's per-install Chrome download.
  puppeteer: false
minimumReleaseAgeExclude:
  # Unversioned, unlike every entry below it, and the asymmetry is the point.
  # `cdk-local` is this maintainer's own package: cdkd tracks it release by
  # release, the code that ships in it is reviewed in its own repository
  # before the tag, and the release is cut from a PR merged here — so the age
  # window buys nothing it does not already have, while costing a day on every
  # coupled change (measured: go-to-k/cdkd#3534 waited on exactly this).
  # It IS a real reduction in protection for this one dependency: a
  # compromised npm token publishing as `cdk-local` would install immediately.
  # Accepted deliberately, and it is the reason the entries below stay pinned
  # per version — they are third-party and get no such treatment.
  - 'cdk-local'
  - '@aws-sdk/client-lambda-microvms@3.1092.0'
  - '@aws-sdk/core@3.976.0'
  - '@aws-sdk/credential-provider-env@3.972.60'
  - '@aws-sdk/credential-provider-http@3.972.62'
  - '@aws-sdk/credential-provider-ini@3.973.5'
  - '@aws-sdk/credential-provider-login@3.972.67'
  - '@aws-sdk/credential-provider-node@3.972.71'
  - '@aws-sdk/credential-provider-process@3.972.60'
  - '@aws-sdk/credential-provider-sso@3.973.4'
  - '@aws-sdk/credential-provider-web-identity@3.972.66'
  - '@aws-sdk/nested-clients@3.997.34'
  - '@aws-sdk/token-providers@3.1092.0'
  - cdk-local@0.148.4
