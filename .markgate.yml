# markgate configuration — https://github.com/go-to-k/markgate
#
# TWO gates back a mechanical merge condition for this repo.
#
# A marker-backed gate exists only under the rule in
# `.claude/rules/hooks.md`: it may block when the harm completes at the moment
# of the action AND lands irreversibly on a third party's artifact, on another
# session's work, or on the maintainer's AWS account. Real-AWS resources the
# maintainer pays for are the third case, which is why `integ-destroy` stayed.
# A state-schema bump is the FIRST case: the migration runs against state
# documents that live in USERS' S3 buckets, one write upgrades them in place,
# and nothing the maintainer can do afterwards puts them back — which is why
# `integ-schema-migration` is here too.
#
# Gates:
#   integ-destroy  — real-AWS deploy + destroy with zero orphan
#                    resources. Set ONLY by /run-integ when the destroy
#                    step finishes with 0 errors and the post-destroy
#                    AWS state is empty. Uses `hash: diff` (markgate
#                    0.4+), so the marker tracks THIS branch's delta
#                    against origin/main rather than the current
#                    content of the scoped files — an unrelated change
#                    arriving from main no longer forces a real-AWS
#                    re-run. Carries a 14d TTL on top of that check, so
#                    a marker stays valid only as long as the AWS-side
#                    behavior it verified is plausibly current. The
#                    PreToolUse hook in
#                    .claude/hooks/integ-destroy-gate.sh blocks
#                    `gh pr merge` (and `gh pr merge --auto`) when this
#                    gate is stale, so deletion-touching code never
#                    reaches main without a verified destroy.
#   integ-schema-migration
#                  — a real-AWS round trip proving a `StackState.version`
#                    bump auto-migrates: deploy under vN, swap binary,
#                    read works, the next write persists vN+1, destroy
#                    clean. Set ONLY by /run-integ, and only for a test
#                    named `schema-v<N>-to-v<N+1>-migration` that ran
#                    clean end to end. Same 14d TTL. The PreToolUse hook
#                    in .claude/hooks/integ-schema-migration-gate.sh
#                    blocks `gh pr merge` on a stale marker, and only for
#                    a PR whose diff really changes the version constant.
#
# `check`, `docs`, `verify-pr`, `pr-review`, `integ-broad` and `integ-local`
# were removed. `/check`, `/check-docs`, `/verify-pr`
# and `/review-pr` remain the RECOMMENDED pre-commit / pre-merge procedure and
# their checklists still apply — they are simply no longer enforced by a marker.
# CI is the other mechanical merge condition (`.claude/hooks/ci-green-gate.sh`,
# a live query rather than a marker).

gates:
  integ-destroy:
    # `hash: diff` (markgate 0.4+) digests this branch's working-tree
    # delta against `merge-base(origin/main, HEAD)`, restricted to the
    # include set below — NOT the current content of those files. The
    # difference only shows up under concurrency, which is this repo's
    # normal state: with `hash: files`, merging main into a feature
    # branch invalidated the marker whenever ANYONE had touched a
    # scoped file, forcing a real-AWS re-run that proved nothing. That
    # invalidation is a false positive by construction — every change
    # on main already passed this same gate in its own PR. Measured
    # over 250 merged PRs (9.4 days): 143 touched this scope, 101 of
    # those were invalidated by another PR's merge, and 100 of the 101
    # had zero file overlap with the incoming change.
    #
    # What is still caught: an in-scope edit on this branch (committed
    # or not), and a change arriving from main to a file THIS branch
    # also modified — the delta is taken from the merge base, so an
    # incoming change to a shared file lands inside our own delta.
    # What is NOT caught: cross-file interaction (main changes B, this
    # branch changes A, a caller uses both). `hash: files` caught that
    # incidentally. Note the bucket carefully: the not-caught class is
    # an unknown subset of the 100 ZERO-OVERLAP cases, not of the 1
    # overlapping case — the overlapping one is precisely what this
    # mode still catches. So the residual risk is bounded above by
    # 100, not by 1, and how much of it is real is unmeasured.
    #
    # Nothing else backstops that class. A broad-set integ gate was
    # the obvious guess and was measured NOT to be one even while it
    # existed: its cross-cutting scope did not cover
    # `src/provisioning/providers/**`, so the commonest instance —
    # this branch changes provider A while main changed provider B —
    # never fired it, and its sentinel binding made it
    # code-independent, so it could not detect an interaction at all.
    # The honest backstop is the TTL below, which forces a periodic
    # real-AWS run regardless of code churn.
    #
    # `base` is mandatory on a diff gate and has no default: markgate
    # deliberately refuses to fall back to `origin/HEAD`, which is
    # frequently unset in CI clones and would make this gate mean
    # different things locally and in CI.
    hash: diff
    base: origin/main
    # Wall-clock TTL on top of the branch-delta check (markgate 0.3+).
    # Real-AWS behavior drifts even when the repo doesn't (AWS SDK
    # updates, API behavior changes, eventual-consistency tweaks); a
    # marker that's been clean for two weeks no longer proves the
    # destroy path actually works against today's AWS. `/run-integ`
    # resets the countdown on every successful set. 14d picked over
    # 7d (too aggressive — would force /run-integ on most PRs touching
    # destroy logic) and 30d (too lax — AWS SDK minors land roughly
    # weekly).
    ttl: 14d
    # Scope: every code path that participates in real-AWS resource
    # destruction. Changing any of these ON THIS BRANCH requires a
    # fresh `/run-integ` destroy verification before the PR can be
    # merged; a change to one of them arriving from main does not. The list is
    # intentionally broad — false positives (forced extra integ runs)
    # are far cheaper than false negatives (broken destroy reaching a
    # release tag).
    include:
      - "src/provisioning/providers/**"
      # The CC provider's delete()/remnant-cleanup is deletion logic too —
      # it was missing from this scope until issue #1252 touched it.
      - "src/provisioning/cloud-control-provider.ts"
      # `region-check.ts` and `destroy-runner.ts` ACTIVATED the merge gate
      # (integ-destroy-gate.sh's provider_pattern / filtered_delete) while
      # sitting outside this list, which is a FAIL-OPEN, not a missing entry:
      # the hook blocked and consulted markgate, but the marker's `hash: diff`
      # digest never saw the file, so `verify` returned 0 and the merge went
      # through with no destroy verification at all. The two lists are now
      # compared in both directions by
      # tests/unit/scripts/cross-cutting-list-sync.test.ts.
      - "src/provisioning/region-check.ts"
      - "src/cli/commands/destroy.ts"
      - "src/cli/commands/destroy-runner.ts"
      - "src/deployment/deploy-engine.ts"
      - "src/analyzer/dag-builder.ts"
      - "src/analyzer/implicit-delete-deps.ts"
      - "src/analyzer/lambda-vpc-deps.ts"
      # The retry classifier sits UNDER every mutating AWS call cdkd makes:
      # `withRetry` wraps every provider's create/update/delete, and
      # `destroy-runner.ts` calls `isRetryableTransientError` directly. Which
      # errors count as retryable therefore decides whether a failed DELETE is
      # retried or surfaced, which is real-AWS delete behavior (issue #2042).
      - "src/deployment/retry.ts"
      - "src/deployment/retryable-errors.ts"
      # Automatic rollback DELETES and re-CREATES real resources — the
      # reverse-replacement path calls `provider.delete()` on the new physical
      # resource and re-creates the old one — so this is delete logic by any
      # reading. Found unscoped while fixing issue #2042, not named by it.
      - "src/deployment/rollback-executor.ts"
      # `getProviderFor` picks the provider that DELETES the resource, not just
      # the one that creates it: `deploy-engine.ts` reads it for the plain
      # delete and for a replacement's old-resource delete, `destroy-runner.ts`
      # for every `cdkd destroy`, and `rollback-executor.ts` at seven sites
      # (`grep -c 'getProviderFor({' src/deployment/rollback-executor.ts` -- a
      # plain `grep getProviderFor` counts two comment mentions as well). So
      # the routing decision reroutes the delete path for every resource in a
      # template at once. It sits in the STRICT half of the hook rather than
      # the hunk-filtered half, and that is measured rather than assumed: the
      # filter looks for `delete|rollback|...` on a changed line, and a routing
      # change does not write those words — five realistic edits across three
      # shapes (a type added to `STICKY_CC_MIGRATION_EXEMPT`, the sticky
      # predicate replaced, a returned `provisionedBy` flipped) matched the
      # filter 0 times, while a control line naming `deleteProvider` matched.
      # Hunk-filtering it would have been a fail-open for exactly the changes
      # it was added for (issue #2720).
      - "src/provisioning/provider-registry.ts"

  integ-schema-migration:
    # Records the last cdkd state-schema migration integ run. cdkd's
    # S3 state schema (the on-disk shape of
    # `s3://bucket/cdkd/<stack>/<region>/state.json`) is the actual
    # user contract — millions of state files live in real AWS
    # accounts under the v1..v5 shapes already shipped. Bumping
    # `StackState.version` (v5 -> v6 etc.) MUST be transparently
    # auto-migrated by the new binary AND verified by a real-AWS
    # integ test that proves the round-trip: deploy under vN -> swap
    # binary -> read works -> next write upgrades to vN+1 silently ->
    # destroy clean. Unit tests can't catch wire-format divergences
    # (`undefined` field stripping, key ordering, schema version
    # coercion); only real round-trip does. Users must never need to
    # run an explicit migrate command for a schema bump — the binary
    # auto-migrates on first write under the new version.
    #
    # Why a separate marker (vs. extending `integ-destroy` /
    # `integ-broad`): a destroy / broad integ flips its marker on
    # ANY clean real-AWS destroy and exercises the v5 binary against
    # v5 state — neither verifies cross-version compatibility. The
    # only thing that does is an integ named
    # `schema-v<N>-to-v<N+1>-migration` which `/run-integ`
    # specifically recognizes and gates the `integ-schema-migration`
    # marker set on.
    #
    # Scope: just `src/types/state.ts` — the file carrying the
    # `StackState.version` literal type, the
    # `STATE_SCHEMA_VERSIONS_READABLE` constant, and every
    # state-shape interface. Editing any other path doesn't touch
    # the schema. The hook
    # (`.claude/hooks/integ-schema-migration-gate.sh`) does a
    # precise second-pass `gh pr diff` grep for actual
    # version-constant additions/deletions so non-bump edits to this
    # file (JSDoc, helper functions, comment fixes) pass through
    # without false-positive activation. Same 14d TTL as the other
    # AWS-coupled gates.
    ttl: 14d
    hash: files
    include:
      - "src/types/state.ts"
