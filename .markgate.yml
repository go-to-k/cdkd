# markgate configuration — https://github.com/go-to-k/markgate
#
# Seven narrow-scope gates back the pre-commit / pre-PR / pre-merge
# checks for this repo. Each gate only invalidates within its own
# `include` set, so a tests-only commit doesn't re-run doc checks. The
# converse no longer holds: `docs/**` is a checker INPUT (issue #2381),
# so a docs-only commit stales `check` too and re-runs the suite. Most gates
# invalidate on the CONTENT of those files (`hash: files`);
# `integ-destroy` instead invalidates on this branch's DELTA against
# origin/main within them (`hash: diff`), and `integ-broad` /
# `pr-review` are bound to sentinel files rather than to source.
#
# Gates:
#   check          — typecheck/lint/build/unit tests
#                    (set by /check and /verify-pr).
#   docs           — README/CLAUDE.md/docs consistency with src
#                    (set by /check-docs and /verify-pr).
#   verify-pr      — full PR-readiness checklist (live-test of changed
#                    behavior, shared-utility caller verification, PR
#                    title + body freshness, and a retrospective that
#                    proposes new rules/hooks/skills for any pattern
#                    that surfaced in the session). Set ONLY by
#                    /verify-pr. Declared as `requires: [check, docs]`
#                    so freshness is the AND of those children plus
#                    the skill's own work; `/verify-pr` cannot mark it
#                    fresh while either child is stale. The PreToolUse
#                    hook in .claude/hooks/verify-pr-gate.sh blocks
#                    `gh pr create` and `gh pr merge` (incl. --auto)
#                    when this gate is stale.
#   integ-destroy  — real-AWS deploy + destroy with zero orphan
#                    resources. Set ONLY by /run-integ when the destroy
#                    step finishes with 0 errors and the post-destroy
#                    AWS state is empty. Uses `hash: diff` (markgate
#                    0.4+), so the marker tracks THIS branch's delta
#                    against origin/main rather than the current
#                    content of the scoped files — an unrelated change
#                    arriving from main no longer forces a real-AWS
#                    re-run. Carries a 14d TTL on top of that check, so
#                    a marker stays valid only as long as the AWS-side
#                    behavior it verified is plausibly current. The PreToolUse hook in
#                    .claude/hooks/integ-destroy-gate.sh blocks
#                    `gh pr merge` (and `gh pr merge --auto`) when this
#                    gate is stale, so deletion-touching code never
#                    reaches main without a verified destroy.
#   pr-review      — `/review-pr` reviewer-dispatch verification on
#                    size-flagged PRs. Set ONLY by the `/review-pr`
#                    skill when its size + bias heuristic recommends
#                    1-reviewer or 3-axis review AND the dispatched
#                    reviewers complete with no blockers. Bound to
#                    the PR's HEAD sha via the `.markgate-pr-review-sha`
#                    sentinel file (the skill writes the current PR's
#                    HEAD sha there before `markgate set`, and the
#                    gate's `include:` scope is just that file — so
#                    a new push to the PR invalidates the marker
#                    automatically without any extra plumbing). The
#                    PreToolUse hook in .claude/hooks/pr-review-gate.sh
#                    blocks `gh pr merge` (NOT `gh pr create` — small
#                    PRs should be openable freely) when the marker
#                    is stale AND the target PR's tier from the
#                    `/review-pr` heuristic is `1-reviewer` or
#                    `3-axis`. `inline`-tier PRs always pass through.
#                    Closes the "sub-agent self-review ≠ independent
#                    review" gap surfaced by PR #267 / issue #270 (see
#                    memory rule feedback_subagent_review_not_self_review.md).
#
#   integ-local    — Docker-based `cdkd local *` family verification
#                    with zero orphan containers / networks. Set ONLY
#                    by /run-integ when a `local-*` integ test (e.g.
#                    `local-invoke`, `local-start-api`, `local-run-task`)
#                    finishes cleanly AND the post-run `docker ps` /
#                    `docker network ls` sweep is empty. Carries a 14d
#                    TTL on top of the file-scope check — Docker base
#                    images (`public.ecr.aws/lambda/*`, RIE binary),
#                    chokidar/network behavior, and `dockerd` semantics
#                    drift over time, so a marker that's been clean for
#                    two weeks no longer proves today's local code path
#                    actually works against today's environment. The
#                    PreToolUse hook in .claude/hooks/integ-local-gate.sh
#                    blocks `gh pr merge` (and `git merge`) when this
#                    gate is stale, so local-execution-touching code
#                    never reaches main without a verified Docker run.
#
# The PreToolUse hook in .claude/hooks/check-gate.sh verifies `check`
# and `docs` on every `git commit`.

gates:
  check:
    hash: files
    include:
      - "src/**"
      - "tests/**"
      # scripts/** holds load-bearing CI logic: the codegen'd-critic family
      # (gen-nested-key-coverage.ts, gen-handled-property-wiring.ts, ...)
      # plus every check-*.ts classifier. Before issue #1592 the enforcement
      # logic sat OUTSIDE the gate that guards it — weakening a classifier
      # did not stale the marker while editing its test (tests/**) did, so
      # a change that narrows what a critic rejects could be committed
      # against a fresh-looking marker.
      - "scripts/**"
      # ALL skills, not just the four verification-depth ones plus
      # work-issues that used to be enumerated here (issue #2364). The old
      # narrowing argued that "editing an ungoverned skill (/cleanup,
      # /hunt-bugs, ...) has nothing to do with this checker"; that premise
      # died when the #2362 split added
      # tests/unit/scripts/skill-file-payload.test.ts, which readdirSync's
      # EVERY skill directory and enforces byte caps + reference-corpus
      # floors — so growing any SKILL.md past its cap reds the suite while a
      # marker scoped to five skills stayed fresh. The four
      # verification-depth skills remain in scope for their original reason
      # too (the checker's SUBJECT is what they say — #1592's shape), and
      # work-issues for #2041's (work-issues-skill-refs.test.ts reads its
      # SKILL.md + references/*.md as INPUT).
      - ".claude/skills/**"
      # `.claude/rules/**` is the #1592 pattern a third time: a checker's INPUT
      # sitting outside the gate that guards it. TEN tests under
      # tests/unit/scripts/ read that directory, and
      # rule-file-payload.test.ts enforces FOUR budgets over it (per-file bytes,
      # per-line bytes, a repo-wide ratchet on lines over the line cap, and a
      # CUMULATIVE corpus total). Without this entry a rules edit can flip that
      # suite red -- or green -- while `check` still verifies fresh, because the
      # digest never saw the file.
      #
      # Measured 2026-08-27, which is why this is here rather than in a comment
      # somewhere: a lane's `.claude/rules` addition pushed the corpus to
      # 901,762 B over a 900,000 B ceiling and turned the full suite red, and
      # `markgate status` reported `check  match` throughout -- both on the
      # failing tree and after the fix. A marker that can attest to a red tree
      # is worse than no marker, since the whole point is that the commit gate
      # trusts it.
      #
      # The cost is the same one `work-issues/**` accepted: a rules-only edit
      # now needs a full `/check`. That is the correct trade -- these files are
      # edited by nearly every retrospective, which is exactly when the budgets
      # move.
      - ".claude/rules/**"
      # CLAUDE.md is a pattern-scanned target of the same checker, so
      # reintroducing banned wording there must stale `check` as well.
      - "CLAUDE.md"
      # Remaining checker-INPUT files the unit suite reads (issue #2364, the
      # #1592/#2041 pattern again — each entry maps to the test that reads it;
      # eligibility-minus-remedy sweep over tests/unit's repo-root reads):
      #   - .claude/settings.json — settings-bash-matcher-coverage.test.ts
      #     (the inert-`if:` class)
      #   - .claude/agents/** — security-surface-list-sync.test.ts reads
      #     pr-security-reviewer.md
      #   - .claude/hooks/** — the WHOLE directory, widened from the three
      #     precise gate hooks this list used to name (issue #2381). The
      #     narrowing's stated reason was that "a hooks-only diff needs no
      #     /check stays true for every hook NO test reads, and hook logic
      #     already has its own harness (test.sh suites + hooks.yml CI)".
      #     Both halves are answered rather than overridden:
      #       * "every hook NO test reads" is not a set the include can be
      #         drawn around. Measured: 7 of the 91 tracked hooks are read by
      #         NAME today, but the suite binds to hook paths through three
      #         shapes, only ONE of which the #2366 sweep's literal
      #         `join(repoRoot, ...)` extractor could see, and the third binds
      #         the DIRECTORY: (1) rule-file-payload.test.ts's PAYLOAD_BUDGETS table
      #         names branch-gate.sh, lib/command-match.sh,
      #         integ-local-gate.sh and main-tree-git-cwd-detector.sh and
      #         asserts each EXISTS; (2) fifteen literal hook paths sit in
      #         `.claude/rules/*.md` frontmatter (gate-sibling-repos.md 8,
      #         hooks-class-fences.md 5, hooks-cwd-detector.md 2), where the
      #         wildcard-free reach assertion is an EXACT equality and the
      #         dead-glob test fires on a rename; (3) hooks.md's
      #         `.claude/hooks/**` carries REACH_FLOORS 68 against 91 tracked
      #         hook files — a POPULATION-level binding that no list of file
      #         NAMES can express, which is what settles glob over a
      #         corrected precise list. Until this change (1) and (2) were
      #         BOTH invisible to
      #         tests/unit/scripts/check-scope-checker-inputs.test.ts — its
      #         literal-join extractor cannot see a path that arrives from a
      #         table — so a corrected precise list would have gone stale
      #         silently the next time a rule satellite or a budget row named
      #         a new hook. That same commit teaches the fence the bare-literal
      #         idiom, which closes (1). It does NOT close (2): those paths live
      #         in `.claude/rules/*.md` frontmatter and the fence's population
      #         is `tests/unit` only, so 10 of the 15 never appear there at all.
      #         (2) and (3) are unrepresentable as a list of names either way,
      #         which is the argument for the glob.
      #       * the hooks' own harness tests hook BEHAVIOUR; the vitest suite
      #         reads hook files as CORPUS (byte budgets, reach counts, list
      #         sync). A green hooks.yml says nothing about a payload budget.
      #     Chronology, since the order is the opposite of the obvious guess:
      #     the literal bindings PREDATE the narrowing (`git log -S` puts
      #     branch-gate.sh in PAYLOAD_BUDGETS at #2215 and
      #     gate-sibling-repos.md at #2242; the comment landed with #2366 on
      #     2026-08-28). The rationale was not overtaken — it was incomplete
      #     when written, because its enumeration came from the extractor
      #     that cannot see a table.
      #     Accepted cost: a hooks-only diff now needs /check.
      #   - the two workflow YAMLs — provider-error-cause / provider-secret-
      #     mask / local-reachability read ci.yml; pr-inherit-issue-labels
      #     .test.ts reads its workflow
      #   - README.md — cc-protection-doc-coverage.test.ts asserts its
      #     registry-type table (found by #2366's own review: the reader
      #     resolves the root as `ROOT` and takes the path from a table, so
      #     the sweep's join-literal regex could not see it — the class
      #     fence's stated known limit, demonstrated live)
      #   - docs/** — the WHOLE tree, widened from the three precise entries
      #     this list used to name (docs/cli-reference.md,
      #     docs/changelog-cdkd.md, docs/_generated/**; issue #2381). Those
      #     three readers are still the reason each of them individually
      #     matters — {full,no}-wait-doc-coverage.test.ts read the
      #     wait-semantics table, changelog-ledger-citation.test.ts the
      #     ledger citations, build-integ-coverage-matrix.test.ts the matrix
      #     snapshots — but they do not bound the population. The
      #     "claims this lane corrected stay corrected TREE-WIDE" block in
      #     tests/unit/scripts/integ-s3-versions-harness.test.ts walks
      #     ROOTS = ['docs', '.claude/rules', 'tests/unit/scripts',
      #     'tests/integration'] RECURSIVELY over every .md/.sh/.ts, floors
      #     the corpus at 300 files, names docs/testing.md, and runs four
      #     FALSIFIED_CLAIMS regexes over EVERY LINE — two of which match bare
      #     number words ("... fixtures", "of the ... callers"), so ordinary
      #     prose is what trips them. `docs` is the only one
      #     of those four roots that was outside this include. A precise
      #     list cannot express it: the population is a subtree and the
      #     predicate is CONTENT.
      #     docs/** also sits in the `docs` gate. Dual-scope membership is
      #     established practice here, not an accident: src/**, README.md,
      #     CLAUDE.md and .claude/rules/** are already in both.
      # Known limit, deliberate (mirrors go-to-k/cdk-local#620's call, and
      # sharpened by go-to-k/cdkd#2381 / go-to-k/cdk-local#630):
      # tests/unit/scripts/source-control-bytes.test.ts reads every tracked
      # non-binary file via `git ls-files` and stays a carve-out — CI is the
      # backstop for it.
      #
      # The predicate that licenses a carve-out is NOT "repo-wide population
      # vs finite one". It is: does the assertion fire on a RARE condition,
      # or on ORDINARY content?
      #   * RARE — source-control-bytes reds on a C0 control byte or a binary
      #     extension missing from BINARY_EXTENSIONS. (It also carries corpus
      #     floors, e.g. `read.length > 2500`, but those have ~850 files of
      #     slack, so they are not an ordinary-editing surface either.)
      #     Ordinary editing anywhere in the tree cannot trip it, so a marker
      #     that does not track the whole tree is proportionate.
      #   * ORDINARY — a whole-tree scanner whose predicate is ordinary prose
      #     or ordinary code MUST have its population inside this include, or
      #     be moved out of the `check` suite. It has no rarity to trade on:
      #     the next routine edit can red it while the marker reads fresh.
      #     That is why docs/** is now scoped rather than carved out — the
      #     FALSIFIED_CLAIMS regexes above match ordinary sentences, two of
      #     them on a bare number word.
      # A future whole-tree scanner must therefore NOT inherit this
      # carve-out by resembling it in POPULATION; it inherits it only by
      # resembling it in PREDICATE. go-to-k/cdk-real-drift's markdown
      # prose-shape scanner is the worked counter-example — same repo-wide
      # population, ordinary-content predicate, so the same call would be
      # wrong there (go-to-k/cdk-real-drift#1837).
      - "README.md"
      - ".claude/settings.json"
      - ".claude/agents/**"
      - ".claude/hooks/**"
      - ".github/workflows/ci.yml"
      - ".github/workflows/pr-inherit-issue-labels.yml"
      - "docs/**"
      # This file itself (the go-to-k/cdk-local#623 sibling, handled in the
      # same session): the gate's own definition decides what the marker
      # MEANS, so editing it — this include list included — must stale a
      # marker recorded under the old definition. Same argument as
      # `.mise.toml` below (the pin decides what green means).
      - ".markgate.yml"
      - "package.json"
      - "pnpm-lock.yaml"
      - "tsconfig*.json"
      # vite.config.ts holds the build / test / lint / codegen task
      # definitions (Vite+), so it defines what "green" means for this
      # gate — editing it must invalidate a previously-recorded marker.
      # Issue 1487: the old list scoped a non-existent vitest.config.ts
      # (plus vestigial build.mjs / .eslintrc* / .prettierrc* — this
      # repo builds via vp/tsdown and lints/formats via Oxlint/Oxfmt,
      # all configured in vite.config.ts).
      - "vite.config.ts"
      # vite.docs.config.ts is a checker INPUT the way README.md is:
      # tests/unit/scripts/docs-site-links.test.ts reads its `navigation`
      # entries and asserts each points at an existing docs/ page, so an
      # edit to the sidebar must stale a marker recorded before it.
      - "vite.docs.config.ts"
      # .mise.toml pins the BINARY that runs those definitions (`vp`), so
      # it has strictly more claim to this scope than the file describing
      # them — and it was the only one missing (issue #1954, the #1592
      # pattern again: enforcement input sitting outside the gate that
      # guards it). A `vp` bump changes what typecheck / lint / build /
      # test mean, so a marker recorded under the old toolchain must not
      # keep reporting fresh.
      #
      # It pins `markgate` too, and that is deliberately NOT extended to
      # the integ gates. Those markers attest to real-AWS behavior, which
      # a tool upgrade does not change, so binding them here would force a
      # deploy + destroy run on a version bump for no evidence gained.
      # The one case that would matter — the marker's MEANING changing
      # out from under it — markgate already self-detects: the 0.3.3 ->
      # 0.4.x bump in #1956 moved integ-destroy from `hash: files` to
      # `hash: diff`, and every existing marker reported
      # `mismatch (hash type changed: files -> diff)` on its next verify
      # rather than silently passing. What remains uncovered is a bump
      # that changes behavior WITHIN one hash type; that is accepted here
      # in exchange for not paying real AWS on every dependency bump.
      - ".mise.toml"

  docs:
    hash: files
    include:
      - "src/**"
      - "docs/**"
      - "README.md"
      - "CLAUDE.md"
      - ".claude/rules/**"

  verify-pr:
    # `requires` (markgate 0.3+) declares verify-pr's freshness as the
    # AND of `check` and `docs` instead of duplicating their include
    # globs. The pre-0.3 layout listed src/** + tests/** + docs/** etc.
    # explicitly here, drifting from check/docs over time. Now: edit
    # any check-scope file -> check stale -> verify-pr stale (and same
    # for docs). Set-time enforcement is also strict — `/verify-pr`
    # cannot mark this gate fresh while either child is stale, which
    # mirrors the skill's actual workflow (it runs /check + /check-docs
    # first). No own `include:` — freshness is purely the AND of
    # children, avoiding the git-tree default.
    requires: [check, docs]

  integ-destroy:
    # `hash: diff` (markgate 0.4+) digests this branch's working-tree
    # delta against `merge-base(origin/main, HEAD)`, restricted to the
    # include set below — NOT the current content of those files. The
    # difference only shows up under concurrency, which is this repo's
    # normal state: with `hash: files`, merging main into a feature
    # branch invalidated the marker whenever ANYONE had touched a
    # scoped file, forcing a real-AWS re-run that proved nothing. That
    # invalidation is a false positive by construction — every change
    # on main already passed this same gate in its own PR. Measured
    # over 250 merged PRs (9.4 days): 143 touched this scope, 101 of
    # those were invalidated by another PR's merge, and 100 of the 101
    # had zero file overlap with the incoming change.
    #
    # What is still caught: an in-scope edit on this branch (committed
    # or not), and a change arriving from main to a file THIS branch
    # also modified — the delta is taken from the merge base, so an
    # incoming change to a shared file lands inside our own delta.
    # What is NOT caught: cross-file interaction (main changes B, this
    # branch changes A, a caller uses both). `hash: files` caught that
    # incidentally. Note the bucket carefully: the not-caught class is
    # an unknown subset of the 100 ZERO-OVERLAP cases, not of the 1
    # overlapping case — the overlapping one is precisely what this
    # mode still catches. So the residual risk is bounded above by
    # 100, not by 1, and how much of it is real is unmeasured.
    #
    # `integ-broad` is NOT the backstop for that class, despite the
    # obvious guess: its CROSS_CUTTING_REGEX (integ-broad-gate.sh)
    # does not cover `src/provisioning/providers/**`, so the commonest
    # instance — this branch changes provider A while main changed
    # provider B — never fires it, and its sentinel binding makes it
    # code-independent, so it cannot detect an interaction at all.
    # The honest backstop is the TTL below, which forces a periodic
    # real-AWS run regardless of code churn.
    #
    # `base` is mandatory on a diff gate and has no default: markgate
    # deliberately refuses to fall back to `origin/HEAD`, which is
    # frequently unset in CI clones and would make this gate mean
    # different things locally and in CI.
    hash: diff
    base: origin/main
    # Wall-clock TTL on top of the branch-delta check (markgate 0.3+).
    # Real-AWS behavior drifts even when the repo doesn't (AWS SDK
    # updates, API behavior changes, eventual-consistency tweaks); a
    # marker that's been clean for two weeks no longer proves the
    # destroy path actually works against today's AWS. `/run-integ`
    # resets the countdown on every successful set. 14d picked over
    # 7d (too aggressive — would force /run-integ on most PRs touching
    # destroy logic) and 30d (too lax — AWS SDK minors land roughly
    # weekly).
    ttl: 14d
    # Scope: every code path that participates in real-AWS resource
    # destruction. Changing any of these ON THIS BRANCH requires a
    # fresh `/run-integ` destroy verification before the PR can be
    # merged; a change to one of them arriving from main does not. The list is
    # intentionally broad — false positives (forced extra integ runs)
    # are far cheaper than false negatives (broken destroy reaching a
    # release tag).
    include:
      - "src/provisioning/providers/**"
      # The CC provider's delete()/remnant-cleanup is deletion logic too —
      # it was missing from this scope until issue #1252 touched it.
      - "src/provisioning/cloud-control-provider.ts"
      # `region-check.ts` and `destroy-runner.ts` ACTIVATED the merge gate
      # (integ-destroy-gate.sh's provider_pattern / filtered_delete) while
      # sitting outside this list, which is a FAIL-OPEN, not a missing entry:
      # the hook blocked and consulted markgate, but the marker's `hash: diff`
      # digest never saw the file, so `verify` returned 0 and the merge went
      # through with no destroy verification at all. The two lists are now
      # compared in both directions by
      # tests/unit/scripts/cross-cutting-list-sync.test.ts.
      - "src/provisioning/region-check.ts"
      - "src/cli/commands/destroy.ts"
      - "src/cli/commands/destroy-runner.ts"
      - "src/deployment/deploy-engine.ts"
      - "src/analyzer/dag-builder.ts"
      - "src/analyzer/implicit-delete-deps.ts"
      - "src/analyzer/lambda-vpc-deps.ts"
      # The retry classifier sits UNDER every mutating AWS call cdkd makes:
      # `withRetry` wraps every provider's create/update/delete, and
      # `destroy-runner.ts` calls `isRetryableTransientError` directly. Which
      # errors count as retryable therefore decides whether a failed DELETE is
      # retried or surfaced, which is real-AWS delete behavior (issue #2042).
      - "src/deployment/retry.ts"
      - "src/deployment/retryable-errors.ts"
      # Automatic rollback DELETES and re-CREATES real resources — the
      # reverse-replacement path calls `provider.delete()` on the new physical
      # resource and re-creates the old one — so this is delete logic by any
      # reading. Found unscoped while fixing issue #2042, not named by it.
      - "src/deployment/rollback-executor.ts"

  pr-review:
    hash: files
    # Scope: a single sentinel file at repo root holding the PR HEAD sha
    # that /review-pr last verified. The skill writes the sha into the
    # file right before `markgate set pr-review`, so the marker's digest
    # is implicitly bound to the PR sha — a new push to the PR will
    # rewrite the file (via the next /review-pr run) and a stale marker
    # with the wrong sha is naturally caught by markgate's digest check.
    # The file is gitignored (see .gitignore) — it's per-checkout
    # bookkeeping, not a tracked artifact. No TTL: PR-sha binding is
    # enough; the skill should re-run when the PR changes anyway.
    include:
      - ".markgate-pr-review-sha"

  integ-broad:
    # Records the last broad real-AWS integ run. The canonical
    # broad-integ set (keep in sync with .claude/hooks/integ-broad-gate.sh
    # error message + .claude/skills/run-integ/SKILL.md step 11 +
    # .claude/skills/verify-pr/SKILL.md step 6 + CLAUDE.md):
    #   bench-cdk-sample
    #   lambda
    #   microservices
    #   drift-revert
    #   drift-revert-vpc
    #   multi-stack-deps
    #   multi-resource
    #   remove-protection
    #   export
    # That seven-way duplication is fenced rather than merely requested:
    # tests/unit/scripts/cross-cutting-list-sync.test.ts compares every
    # copy against the hook's block message. It was written after the
    # hook's own header comment was found carrying 8 of these 9 names.
    # Narrow feature integs like `import-value-strong-ref` flip the
    # `integ-destroy` marker but do not exercise multi-resource VPC /
    # Lambda / Custom-Resource paths, so a cross-cutting code change
    # to `src/deployment/deploy-engine.ts` etc. can ship a regression
    # the narrow integ never sees. This gate's hook blocks `gh pr
    # merge` when the diff touches cross-cutting paths AND the marker
    # is stale, forcing a broad integ in addition to whatever feature
    # integ the change came with.
    #
    # Why a separate marker (vs. extending `integ-destroy`): a markgate
    # marker records a digest, not provenance, so `integ-destroy`
    # doesn't distinguish which integ flipped it. The sentinel below is written ONLY by
    # /run-integ when a broad-set test name passes — so a narrow
    # feature integ legitimately flips `integ-destroy` (it WAS a
    # clean real-AWS destroy) while leaving `integ-broad` stale,
    # which is exactly the gradient we want.
    #
    # Scope: a sentinel file at repo root carrying the last broad
    # integ's test name + timestamp. Updated ONLY by /run-integ when
    # the test name is in the broad set AND the run was clean.
    # Gitignored — per-checkout bookkeeping, not a tracked artifact.
    # Same 14d TTL as the other AWS-coupled gates so the marker ages
    # out automatically and the next cross-cutting PR triggers a
    # fresh broad run regardless of code changes.
    ttl: 14d
    hash: files
    include:
      - ".markgate-broad-integ-test"

  integ-local:
    hash: files
    # Wall-clock TTL on top of the file-scope check (markgate 0.3+).
    # Docker base-image behavior (`public.ecr.aws/lambda/*`, RIE
    # binary), `dockerd` semantics, and chokidar / network plumbing
    # drift even when the repo doesn't. 14d matches the integ-destroy
    # gate: aggressive enough to catch environment drift, lax enough
    # to avoid forcing a Docker run on every local-touching PR.
    ttl: 14d
    # Scope: every code path that participates in `cdkd local *`
    # execution (Lambda RIE containers, ECS task emulation, HTTP
    # server, container pool, etc.). Editing any of these REQUIRES a
    # fresh `/run-integ local-*` verification before the PR can be
    # merged. The list is intentionally broad — false positives
    # (forced extra integ runs) are far cheaper than false negatives
    # (a broken local path reaching a release tag).
    include:
      - "src/local/**"
      - "src/cli/commands/local-*.ts"
      - "tests/integration/local-*/**"

  integ-schema-migration:
    # Records the last cdkd state-schema migration integ run. cdkd's
    # S3 state schema (the on-disk shape of
    # `s3://bucket/cdkd/<stack>/<region>/state.json`) is the actual
    # user contract — millions of state files live in real AWS
    # accounts under the v1..v5 shapes already shipped. Bumping
    # `StackState.version` (v5 -> v6 etc.) MUST be transparently
    # auto-migrated by the new binary AND verified by a real-AWS
    # integ test that proves the round-trip: deploy under vN -> swap
    # binary -> read works -> next write upgrades to vN+1 silently ->
    # destroy clean. Unit tests can't catch wire-format divergences
    # (`undefined` field stripping, key ordering, schema version
    # coercion); only real round-trip does. Users must never need to
    # run an explicit migrate command for a schema bump — the binary
    # auto-migrates on first write under the new version.
    #
    # Why a separate marker (vs. extending `integ-destroy` /
    # `integ-broad`): a destroy / broad integ flips its marker on
    # ANY clean real-AWS destroy and exercises the v5 binary against
    # v5 state — neither verifies cross-version compatibility. The
    # only thing that does is an integ named
    # `schema-v<N>-to-v<N+1>-migration` which `/run-integ`
    # specifically recognizes and gates the `integ-schema-migration`
    # marker set on.
    #
    # Scope: just `src/types/state.ts` — the file carrying the
    # `StackState.version` literal type, the
    # `STATE_SCHEMA_VERSIONS_READABLE` constant, and every
    # state-shape interface. Editing any other path doesn't touch
    # the schema. The hook
    # (`.claude/hooks/integ-schema-migration-gate.sh`) does a
    # precise second-pass `gh pr diff` grep for actual
    # version-constant additions/deletions so non-bump edits to this
    # file (JSDoc, helper functions, comment fixes) pass through
    # without false-positive activation. Same 14d TTL as the other
    # AWS-coupled gates.
    ttl: 14d
    hash: files
    include:
      - "src/types/state.ts"
