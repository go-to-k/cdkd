name: docs-deploy

# Build the cdkd.dev documentation site (Ox Content SSG, vite.docs.config.ts)
# and deploy it to GitHub Pages. PRs only build (deploy job is main-only) so a
# broken site config fails the PR instead of production.

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "docs-site/**"
      - "vite.docs.config.ts"
      - ".github/workflows/docs-deploy.yml"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
  # No `paths:` filter on PRs, deliberately, and NOT an oversight to be tidied
  # back into sync with the push list above. `build` is a REQUIRED status check
  # in the `main` branch ruleset, and a required check can only be required if
  # it reports on every PR: a `paths:`-filtered workflow does not start at all
  # when nothing matches, leaving the check at "Expected" forever and blocking
  # the PR permanently. A skipped JOB reports and counts as passing; a workflow
  # that never ran does not report.
  #
  # What that requirement buys is exactly what the old comment here promised and
  # could not deliver once auto-merge existed: "a dependency bump that breaks
  # the docs build must fail on the PR, not after merge." `package.json` and
  # `pnpm-lock.yaml` are in the push filter for that reason, so every dependabot
  # PR built the docs — but with auto-merge armed and this check not required,
  # the merge would proceed over a red build anyway. The cost is one docs build
  # on PRs that touch neither docs nor dependencies.
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # PRs cancel, main does not. `build` became a REQUIRED check that runs on
  # every PR, so with `cancel-in-progress: false` a second push queued its full
  # SSG build behind the superseded one and every PR's required check
  # serialized. A superseded PR build has no value; a superseded main build
  # feeds a deploy, so that one still runs to completion.
  group: docs-deploy-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          # ssg.lastUpdated reads per-page git commit timestamps; a shallow
          # clone would silently drop them.
          fetch-depth: 0
      - uses: voidzero-dev/setup-vp@49c3e4e92c52e7f8392712a9267bbe71c5ab30e5 # v1
        with:
          node-version: "24"
      - run: vp install --frozen-lockfile
      # OG image generation needs a Playwright-managed Chromium; without it the
      # build still succeeds but silently skips every og-image.png and the
      # og:image/twitter:image meta tags ("Chromium not available" warning).
      # The guard step below turns that silent degradation into a hard failure.
      # Direct .bin path: setup-vp does not put pnpm on PATH.
      #
      # The Google Chrome apt repository is dropped first because
      # `--with-deps` runs `apt-get update`, which fails WHOLESALE when any
      # single configured repository is unhealthy -- and the runner image
      # ships that one by default. This job reads no package from it:
      # Playwright manages its own Chromium build, and `--with-deps` is here
      # only for the shared OS libraries that build needs.
      #
      # Measured 2026-09-09 (issue #2879): Google served a `Packages.gz` whose
      # hash did not match the `Release` file beside it, so the step died with
      # `Hash Sum mismatch` for ~90 minutes. `main` went red at 17:26:41Z and
      # every docs-touching PR became unmergeable behind `ci-green-gate`;
      # seven retries over that window reproduced it before the mirror
      # recovered on its own.
      #
      # This removes the COUPLING, not the class: another configured
      # repository going unhealthy would still red this step, because
      # `apt-get update` has no per-repository tolerance.
      #
      # Matched by CONTENT rather than by filename: the runner image's name
      # for this list is not something this workflow can verify, and a
      # filename that stops matching would make the step a silent no-op --
      # green until the next outage. The receipt is printed for the same
      # reason, so a future run shows whether it removed anything.
      - name: Drop the Google Chrome apt repository (issue #2879)
        run: |
          set -euo pipefail
          before=$(grep -rl 'dl\.google\.com' /etc/apt/sources.list.d/ 2>/dev/null || true)
          if [ -n "${before}" ]; then
            echo "removing: ${before}"
            printf '%s\n' "${before}" | xargs -r sudo rm -f
          else
            echo "no dl.google.com repository configured -- nothing to remove"
          fi
          if grep -rq 'dl\.google\.com' /etc/apt/sources.list.d/ 2>/dev/null; then
            echo "still configured after removal:" >&2
            grep -rn 'dl\.google\.com' /etc/apt/sources.list.d/ >&2
            exit 1
          fi
      - run: ./node_modules/.bin/playwright install --with-deps chromium
      - run: vp run docs:build
      - name: Assert OG images were generated
        # The root og-image.png catches a missing Chromium; the count catches a
        # template regression that fails per-page rendering (each failure only
        # warns). 30 is a floor well under the current ~45 pages.
        run: |
          test -f dist/site/og-image.png
          count=$(find dist/site -name og-image.png | wc -l)
          echo "og images: $count"
          test "$count" -ge 30
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist/site

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
