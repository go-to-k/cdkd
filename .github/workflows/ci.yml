name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check-build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6

      - uses: voidzero-dev/setup-vp@1b32467adbe183473499fd9d5d372c3ed9641754 # v1
        with:
          node-version: "24"
          cache: true
          run-install: false

      - run: vp install --frozen-lockfile
      - run: vp run check
      # Issue #1133 — `vp run check` type-checks tsconfig.json only (src/** +
      # types/**), which excludes `**/*.test.ts`. Type-check the test project
      # separately so a wrong `import type` or a stale mock shape in a test
      # file fails CI instead of slipping through.
      - run: vp run typecheck:test
      # `build` runs BEFORE `test` on purpose. `dist/` is gitignored, and
      # `tests/unit/cli/version.test.ts` skips itself when `dist/cli.js` is
      # absent -- so with the old order its two fences (the entry-chunk bound
      # and the command-tree-stub wiring fence added for issue #2002) were
      # green-by-SKIP on every PR, i.e. the only coverage of the `--version`
      # fast path never executed in CI. Measured with `dist/` absent:
      # `Test Files 1 skipped (1) / Tests 3 skipped (3)`. The test also asserts
      # loudly rather than skipping when `CI` is set, so a future reorder
      # cannot silently re-disarm it -- the comment and the assertion are
      # deliberately redundant, because the comment alone is what failed here.
      - run: vp run build
      # CDKD_EXPECT_DIST is set ONLY here, because this is the only job that
      # builds. `tests/unit/cli/version.test.ts` skips itself when `dist/` is
      # absent -- correct for a contributor who has not built, and correct for
      # the `once-leak-detect` / `runtime-compat` jobs, which do not build
      # either. Keying the loud assertion on a bare `CI` reddened those two
      # jobs; keying it on the build is what actually says "dist was produced,
      # so a skip here means the step order regressed".
      # Assert the suite actually RAN, not merely that the step exited 0.
      # `vp run test` goes through the Vite+ task runner, and a task-runner
      # failure that never reaches vitest exits 0 while printing no `Test Files`
      # summary -- observed locally as a cache-encoder overflow
      # (`Cache lookup failed: Encoded sequence length exceeded preallocation
      # limit`) that ran nothing and looked green. The `test` task is now
      # `cache: false`, which removes that particular path, but "the tests
      # passed" and "the tests ran" are different claims and an exit code only
      # ever carries the first.
      - name: unit tests
        run: |
          set -o pipefail
          vp run test 2>&1 | tee /tmp/unit-test.log
          # Matched by CONTENT, not by line start, and not by a digit-free gap.
          # Under CI the summary is ANSI coloured -- the real bytes are
          # `\e[2m Test Files \e[22m \e[1m\e[32m845 passed` -- so a
          # `^[[:space:]]*` anchor never matches (this step failed a green run
          # that way), and a `[^0-9]*` gap stops inside `\e[22m`. Requiring a
          # COUNT plus passed/failed after the phrase is what keeps prose that
          # merely mentions it from satisfying the check.
          if ! grep -qE 'Test Files.*[0-9]+ (passed|failed)' /tmp/unit-test.log; then
            echo "::error::vitest printed no 'Test Files' summary — the suite did not run"
            exit 1
          fi
        env:
          CDKD_EXPECT_DIST: "1"

      # Issue #399 — fail CI when docs/integ-coverage.md or
      # docs/_generated/integ-coverage.json is stale relative to
      # src/provisioning/register-providers.ts +
      # tests/integration/*/{lib,bin}/*.ts. Regenerate via the same
      # `vp run integ-coverage` task the contributor would run, then
      # fail-on-diff. Closes the "forgot to regenerate after editing"
      # gap that the /verify-pr skill step is the manual fallback for.
      - name: integ-coverage matrix is up-to-date
        run: |
          vp run integ-coverage
          if ! git diff --quiet -- docs/integ-coverage.md docs/_generated/integ-coverage.json; then
            echo "::error::integ-coverage matrix is stale — run \`vp run integ-coverage\` and commit the regenerated docs/integ-coverage.md + docs/_generated/integ-coverage.json"
            git --no-pager diff -- docs/integ-coverage.md docs/_generated/integ-coverage.json
            exit 1
          fi

      # Issue #1071 — fail CI when docs/cli-flag-coverage.md or
      # docs/_generated/cli-flag-coverage.json is stale relative to the
      # declared CLI flags (src/cli/options.ts) + tests/integration/*/verify.sh.
      # Same `vp run ... && git diff --exit-code` shape as the
      # integ-coverage step above. This is a STALENESS guard only (the
      # generated file must track its inputs); it deliberately does NOT
      # hard-fail on low coverage % — many flags are unit-tested rather
      # than exercised in an integ verify.sh (see the report's own
      # "VISIBILITY report, not a CI gate" note). Closes the gap where the
      # matrix had not been regenerated since PR #504 and drifted silently.
      - name: cli-flag-coverage matrix is up-to-date
        run: |
          vp run cli-flag-coverage
          if ! git diff --quiet -- docs/cli-flag-coverage.md docs/_generated/cli-flag-coverage.json; then
            echo "::error::cli-flag-coverage matrix is stale — run \`vp run cli-flag-coverage\` and commit the regenerated docs/cli-flag-coverage.md + docs/_generated/cli-flag-coverage.json"
            git --no-pager diff -- docs/cli-flag-coverage.md docs/_generated/cli-flag-coverage.json
            exit 1
          fi

      # Issue #1112 — fail CI when docs/_generated/integ-last-run.tsv breaks
      # its "exactly one row per test" invariant or its sorted order. The
      # ledger is an update-type file, but /run-integ appends to it, so a
      # rebase replays the append against a base that already carries the
      # row and git auto-merge takes BOTH sides — 10 tests on main had
      # silently accumulated duplicates that way. `vp run
      # integ-ledger-normalize` rewrites the whole file deterministically
      # (newest row per test, sorted by test name), which is both the
      # rebase-safe write path and the invariant check: a replayed commit
      # now produces an IDENTICAL file rather than an additive diff. Same
      # `vp run ... && git diff --exit-code` shape as the matrix steps
      # above. The script ALSO hard-fails on a malformed row (wrong column
      # count / unparseable timestamp) rather than dropping it silently, so
      # this step covers both classes.
      - name: integ-last-run ledger is normalized
        run: |
          vp run integ-ledger-normalize
          if ! git diff --quiet -- docs/_generated/integ-last-run.tsv; then
            echo "::error::integ-last-run ledger is not normalized (duplicate rows or wrong order) — run \`vp run integ-ledger-normalize\` and commit docs/_generated/integ-last-run.tsv"
            git --no-pager diff -- docs/_generated/integ-last-run.tsv
            exit 1
          fi

      # Issue #398 — fail CI when the cached three-tier provider-coverage
      # audit (docs/_generated/provider-coverage.json) Tier 1 list drifts
      # from src/provisioning/register-providers.ts. Offline check (<1s,
      # no AWS calls — the full regeneration via
      # `vp run audit:coverage:regenerate` would take 10-30 min + AWS
      # CFn DescribeType throttling and stays a manual / future-cron job
      # per issue #398 Option A). Catches the "added a new provider but
      # forgot to regen the audit cache" case structurally, mirroring
      # the integ-coverage step above.
      - run: vp run audit:coverage:check

      # Issue #2553 — fail CI when a tier-2 stateful CANDIDATE in
      # docs/_generated/stateful-candidates.json is neither in STATEFUL_TYPES
      # nor dispositioned in the derivation's NOT_GUARDED map (and when a
      # NOT_GUARDED entry has stopped being proposed, so it disposes of
      # nothing). Offline check (<1s, no AWS calls); the regeneration via
      # `vp run audit:stateful-candidates:regenerate` issues a DescribeType per
      # tier-2 type and stays manual for the same reason
      # audit:coverage:regenerate does. Bare `run` like audit:coverage:check —
      # the critic is pass/fail with nothing to regenerate.
      - run: vp run audit:stateful-candidates:check

      # Issue #2388 — fail CI when a file under src/ constructs an
      # @aws-sdk/client-* client without spreading awsClientDefaults() first.
      # The AWS SDK for JavaScript v3 does not read HTTPS_PROXY / HTTP_PROXY,
      # so such a client cannot reach AWS behind a corporate proxy at all — and
      # it fails at CREDENTIAL resolution, before any service call, with a
      # certificate error naming neither the proxy nor the client. No test
      # catches it, because no test runs behind a proxy. Bare `run` like
      # audit:coverage:check: the critic is pass/fail with nothing to
      # regenerate. Its allow-list (tests/aws-client-defaults-allowlist.json)
      # may only shrink — a stale or dead entry fails too.
      - run: vp run audit:aws-client-defaults:check

      # Issue #423 — fail CI when docs/scenario-coverage.md or
      # docs/_generated/scenario-coverage.json is stale relative to
      # the KNOWN_SCENARIOS taxonomy in
      # scripts/build-scenario-coverage-matrix.ts and the per-fixture
      # tests/integration/<name>/.scenarios.json sidecars. Same shape as
      # the integ-coverage step above. The script ALSO hard-fails on a
      # sidecar carrying an unknown tag (typo guard), so the step covers
      # both "forgot to regenerate" and "wrote a typo tag" classes.
      - name: scenario-coverage matrix is up-to-date
        run: |
          vp run scenario-coverage
          if ! git diff --quiet -- docs/scenario-coverage.md docs/_generated/scenario-coverage.json; then
            echo "::error::scenario-coverage matrix is stale — run \`vp run scenario-coverage\` and commit the regenerated docs/scenario-coverage.md + docs/_generated/scenario-coverage.json"
            git --no-pager diff -- docs/scenario-coverage.md docs/_generated/scenario-coverage.json
            exit 1
          fi

      # Fail CI when src/provisioning/unsupported-types.generated.ts is stale
      # relative to docs/_generated/provider-coverage.json (tier3). The runtime
      # pre-flight reads the generated module, so it must track the audit cache.
      # Same shape as the integ-coverage / scenario-coverage staleness guards.
      - name: unsupported-types module is up-to-date
        run: |
          vp run gen:unsupported-types
          if ! git diff --quiet -- src/provisioning/unsupported-types.generated.ts; then
            echo "::error::src/provisioning/unsupported-types.generated.ts is stale — run \`vp run gen:unsupported-types\` and commit the regenerated module"
            git --no-pager diff -- src/provisioning/unsupported-types.generated.ts
            exit 1
          fi

      # Fail CI when src/provisioning/property-coverage.generated.ts is stale
      # relative to the CFn schema fixtures + each SDK provider's
      # handledProperties / unhandledByDesign declarations. The runtime
      # property-level pre-flight (ProviderRegistry.validateResourceProperties)
      # reads the generated module, so it must track the source data.
      # The codegen writes a raw multi-line shape; the committed module is
      # Prettier-formatted, so we run `vp run format` after the codegen to
      # canonicalize before diffing (mirrors how the file was written at
      # scaffold time in 476d3c1).
      - name: property-coverage module is up-to-date
        run: |
          vp run gen:property-coverage
          vp run format
          if ! git diff --quiet -- src/provisioning/property-coverage.generated.ts; then
            echo "::error::src/provisioning/property-coverage.generated.ts is stale — run \`vp run gen:property-coverage && vp run format\` and commit the regenerated module"
            git --no-pager diff -- src/provisioning/property-coverage.generated.ts
            exit 1
          fi

      # Fail CI when docs/_generated/enrichment-coverage.{json,md} is stale
      # relative to the CFn schema fixtures + the enrichResourceAttributes
      # switch in src/provisioning/cloud-control-provider.ts. The matrix records
      # which CC-routable types' computed readOnly Fn::GetAtt attributes are
      # populated by enrichment (the bug class fixed in #844/#864/#865/#866).
      # Same diff-on-stale shape as the integ-coverage / property-coverage
      # guards above. The second step is the CRITIC: it hard-fails on a pure-CC
      # (no-SDK-provider) latent gap that is neither enriched nor allow-listed.
      - name: enrichment-coverage matrix is up-to-date
        run: |
          vp run gen:enrichment-coverage
          if ! git diff --quiet -- docs/_generated/enrichment-coverage.json docs/_generated/enrichment-coverage.md; then
            echo "::error::enrichment-coverage matrix is stale — run \`vp run gen:enrichment-coverage\` and commit the regenerated docs/_generated/enrichment-coverage.{json,md}"
            git --no-pager diff -- docs/_generated/enrichment-coverage.json docs/_generated/enrichment-coverage.md
            exit 1
          fi
      - run: vp run audit:enrichment-coverage:check

      # Fail CI when docs/_generated/sdk-attr-coverage.{json,md} is stale
      # relative to the CFn schema fixtures + each SDK provider's create/update
      # attribute keys + the constructAttribute type coverage. The matrix records
      # which SDK-backed types' read-only Arn/Url Fn::GetAtt attributes are
      # resolvable (cached by the provider OR constructAttribute-handled); a gap
      # is the #1179 deploy-break class. The second step is the CRITIC: it
      # hard-fails on any unresolvable Arn/Url attribute that is not allow-listed.
      - name: sdk-attr-coverage matrix is up-to-date
        run: |
          vp run gen:sdk-attr-coverage
          if ! git diff --quiet -- docs/_generated/sdk-attr-coverage.json docs/_generated/sdk-attr-coverage.md; then
            echo "::error::sdk-attr-coverage matrix is stale — run \`vp run gen:sdk-attr-coverage\` and commit the regenerated docs/_generated/sdk-attr-coverage.{json,md}"
            git --no-pager diff -- docs/_generated/sdk-attr-coverage.json docs/_generated/sdk-attr-coverage.md
            exit 1
          fi
      - run: vp run audit:sdk-attr-coverage:check

      # Fail CI when docs/_generated/update-wrap-coverage.{json,md} is stale
      # relative to the provider sources. The matrix records, per provider
      # class declaring update(), whether every AWS `send` reachable from
      # update() (following this.x() delegation edges) is wrapped in a
      # ProvisioningError — and whether that wrap re-throws cdkd-typed errors
      # untouched. An unwrapped send is the #1263 / #1267 class (a raw SDK
      # error bypassing cdkd's exit-code handling); an unguarded wrap silently
      # disables the deploy engine's by-class replacement fallback. The second
      # step is the CRITIC: it hard-fails on either, unless allow-listed.
      - name: update-wrap-coverage matrix is up-to-date
        run: |
          vp run gen:update-wrap-coverage
          if ! git diff --quiet -- docs/_generated/update-wrap-coverage.json docs/_generated/update-wrap-coverage.md; then
            echo "::error::update-wrap-coverage matrix is stale — run \`vp run gen:update-wrap-coverage\` and commit the regenerated docs/_generated/update-wrap-coverage.{json,md}"
            git --no-pager diff -- docs/_generated/update-wrap-coverage.json docs/_generated/update-wrap-coverage.md
            exit 1
          fi
      - run: vp run audit:update-wrap-coverage:check

      # Fail CI when docs/_generated/nested-key-coverage.{json,md} is stale
      # relative to the provider sources / schema fixtures / SDK typings. The
      # matrix diffs, per SDK provider forwarding a nested CFn config blob,
      # the blob's nested CFn property names against the SDK client model's
      # member names — a CFn key with no same-spelling SDK member and no
      # explicit mention in the provider is a write-side silent drop (the
      # #1370 CloudFront / #1304 MetricTimeZone class; issue #1373). The
      # second step is the CRITIC: it hard-fails on any non-allow-listed
      # divergence.
      - name: nested-key-coverage matrix is up-to-date
        run: |
          vp run gen:nested-key-coverage
          if ! git diff --quiet -- docs/_generated/nested-key-coverage.json docs/_generated/nested-key-coverage.md; then
            echo "::error::nested-key-coverage matrix is stale — run \`vp run gen:nested-key-coverage\` and commit the regenerated docs/_generated/nested-key-coverage.{json,md}"
            git --no-pager diff -- docs/_generated/nested-key-coverage.json docs/_generated/nested-key-coverage.md
            exit 1
          fi
      - run: vp run audit:nested-key-coverage:check

      # Fail CI when docs/_generated/handled-property-wiring.{json,md} is stale
      # relative to the provider sources. The matrix records, per SDK provider
      # class declaring handledProperties, whether each DECLARED property is
      # actually READ off the template property bag (following
      # this.helper(properties) delegation and table-driven loops). A
      # declaration with no read evidence is either a wiring gap or a
      # mis-declared property — the #1392 ECRProvider class, which
      # gen-property-coverage.ts structurally cannot see because that pre-flight
      # passes on the strength of the declaration alone (issue #1404). The
      # second step is the CRITIC: it hard-fails on any un-wired declaration
      # that is not allow-listed, and on a stale allow-list entry.
      - name: handled-property-wiring matrix is up-to-date
        run: |
          vp run gen:handled-property-wiring
          if ! git diff --quiet -- docs/_generated/handled-property-wiring.json docs/_generated/handled-property-wiring.md; then
            echo "::error::handled-property-wiring matrix is stale — run \`vp run gen:handled-property-wiring\` and commit the regenerated docs/_generated/handled-property-wiring.{json,md}"
            git --no-pager diff -- docs/_generated/handled-property-wiring.json docs/_generated/handled-property-wiring.md
            exit 1
          fi
      - run: vp run audit:handled-property-wiring:check

      # Issue #2040 — every provider `catch` site (and every `wrapError` helper a
      # catch hands its binding to) must thread the caught AWS error as `cause`.
      # `isTransientServerError` / `isThrottlingError` / `isMarkedNonRetryable`
      # all locate their signal by walking `.cause`, so a wrapper that drops it
      # makes all three inert and the SAME AWS failure becomes retryable in one
      # provider and terminal in another. Unlike the matrix guards above there is
      # nothing to regenerate — the critic is pass/fail — so it is a bare `run`
      # like audit:coverage:check. It also self-probes its own classifier before
      # reading the tree, so a degradation to "everything looks threaded" fails
      # here rather than reporting a byte-identical green.
      - run: vp run audit:provider-error-cause:check

      # Issue #2228 — cdkd's `src/local/**` is half its own code and half a
      # re-export surface over cdk-local, and the boundary between them has moved
      # several times. A module that moves out does not stop compiling and does
      # not stop being tested; it stops being CALLED, leaving a decoy at the path
      # a grep lands on. #2203's fix landed in two such orphans, passed every gate
      # and shipped as a no-op — a live probe returned the whole value it was
      # meant to truncate. This critic requires every exported value symbol with a
      # cdkd-authored body there to be reachable from a shipped entry point or to
      # say at its declaration that it is not, and it fails on a STALE annotation
      # too, so the annotations cannot rot. Re-export shims are exempt by
      # construction (no body to edit), not by an allowlist. It self-probes its
      # own classifier in both directions before reading the tree.
      - run: vp run audit:local-reachability:check

      # Issue #2053 — every `withRetry` under `src/provisioning/**` must thread
      # `isInterrupted` / `onInterrupted`. It is the only wait in the codebase
      # that polls an interrupt DURING a backoff, so an un-threaded call leaves
      # Ctrl-C dead for minutes, and on the destroy path `withResourceTimeout`
      # has already abandoned the promise — the loop keeps issuing writes behind
      # a run the user was told had ended. Measured at filing: 11 sites under
      # `providers/**` and one of them threaded. Pass/fail like the critic above,
      # with nothing to regenerate, so it is a bare `run`; it self-probes its own
      # classifier and re-audits its exemption list before reading the tree, so a
      # degradation to "everything looks threaded" fails here instead of
      # reporting a byte-identical green.
      - run: vp run audit:withretry-interrupt:check

      # Issue #2178 — a provider interpolating a `properties`-derived value into
      # a message must mask it BEFORE `JSON.stringify`. The bag arrives RESOLVED,
      # so a `{{resolve:secretsmanager:...}}` scalar is already plaintext, and
      # masking the FINISHED message cannot recover it (stringify escapes the
      # secret out of existence, and the message is too long for anything but
      # the >= 4-character substring arm). The rule was prose from issue #1932
      # and the issue #2176 sweep found it violated in files already hardened
      # for it. Pass/fail with nothing to regenerate, so a bare `run`; the
      # classifier is dataflow-aware (a mask upstream of the stringify passes),
      # self-probes itself against fixed sources with known verdicts INCLUDING
      # raw ones before reading the tree, and re-audits every exemption against
      # its site's current VERDICT — an entry whose site disappeared, became
      # MASKED upstream, or gained a same-spelled sibling fails — so a
      # degradation to "everything looks masked" fails here rather than
      # reporting a byte-identical green. It also REFUSES an identity masker:
      # a `maskerOrIdentity(undefined)` binding fences nothing (issue #2007)
      # and must not silence a site or count toward the masked floor.
      # KNOWN BOUND (4), stated HERE too because this is the one file a reader
      # meets the refusal in without the surrounding prose: the check is
      # SYNTACTIC, so a no-op DECLARED to be the capability is believed
      # (`const m: MaskerFn = someNoOp`, `{ maskSecrets: (t) => t }`). A green
      # run means the value reached something DECLARED to be the project's
      # masker -- NOT that the value is masked. Both spellings are pinned as
      # self-probes expecting `masked`, so closing the bound fails loudly.
      - run: vp run audit:provider-secret-mask:check

  # Issue #1618 — run the unit suite a second time with the runtime
  # `*Once`-leak detector armed, so a test that primes more mock responses than
  # its code path consumes fails HERE instead of silently shifting every later
  # test in its file by one response.
  #
  # A separate job rather than a step in check-build-test: it is a full second
  # suite run (~3 min) and it must not delay the signal contributors actually
  # wait on. It is also why the detector is env-gated OFF by default — the
  # normal `vp run test` is byte-for-byte unaffected by this landing.
  #
  # The files in tests/once-leak-allowlist.json are grandfathered. Fixing one
  # and dropping it from the list is the intended ratchet direction; adding a
  # new entry is not, and a new test file that leaks fails this job.
  once-leak-detect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6

      - uses: voidzero-dev/setup-vp@1b32467adbe183473499fd9d5d372c3ed9641754 # v1
        with:
          node-version: "24"
          cache: true
          run-install: false

      - run: vp install --frozen-lockfile
      - run: vp run test:once-leak

      # Prove the detector still REJECTS, not just that it ran. With the
      # grandfather list honoured, "the detector went dead" and "the tree is
      # clean" produce the identical green result above — the vacuous pass
      # .claude/rules/testing.md forbids for any checker. The canary suite
      # leaks on purpose, so ignoring the allow-list MUST fail it.
      - name: detector canary — a known leak must still be caught
        run: |
          set +e
          vp run test:once-leak-canary > canary.log 2>&1
          rc=$?
          set -e
          cat canary.log
          # Assert on the detector's OWN message, not merely on a non-zero exit.
          # A deleted or renamed canary file makes `vp test run <missing>` exit 1
          # with "No test files found", and so does a syntax error or a failed
          # install -- each of which would let this step pass while the detector
          # is dead. That is the exact vacuous pass the step exists to close.
          if [ "${rc}" -eq 0 ] || ! grep -q 'primed by an EARLIER test' canary.log; then
            echo "::error::the *Once-leak detector did not report the deliberate leak in tests/unit/scripts/once-leak-canary.test.ts (exit ${rc}). Either the detector has gone dead (check @vitest/spy internals and the vi.fn patch in tests/setup.ts), or the canary file itself is missing / broken."
            exit 1
          fi

  runtime-compat:
    runs-on: ubuntu-latest
    needs: check-build-test
    strategy:
      matrix:
        node-version: [20, 22, 24]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6

      - uses: voidzero-dev/setup-vp@1b32467adbe183473499fd9d5d372c3ed9641754 # v1
        with:
          node-version: "24"
          cache: true
          run-install: false

      - run: vp install --frozen-lockfile
      - run: vp run build
      - run: vp env exec --node ${{ matrix.node-version }} node dist/cli.js --version
