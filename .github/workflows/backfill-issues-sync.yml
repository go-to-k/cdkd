# Keeps the backfill campaign's issues equal to what `main` says, by rendering
# them from `main` whenever `main`'s coverage map moves.
#
# "Issues", plural: the campaign is one generated issue per resource type that
# still has silently-dropped properties. This job reconciles that set —
# creating, updating and closing. There is NO parent issue: each
# per-type issue body carries the procedure, and the `backfill-type` label
# groups them.
#
# go-to-k/cdkd#2949 made the per-type issues, under a parent. The shape changed
# because a single 288-row checklist could not be LINKED to the work that
# advances it. A pull request wiring one type had nothing to `Closes`, since the
# checklist has to stay open for the other 43 types, so the campaign was
# invisible to `Closes`, to `pr-inherit-issue-labels.yml` and to the
# `/work-issues` claim flow. At type granularity 25 of the 44 types hold 1-3
# properties, so a single pull request closes its issue outright for the
# majority. Service granularity was measured and rejected: RDS alone spans
# `DBInstance` (62), `DBCluster` (40) and others, and even DynamoDB — the
# smallest multi-provider service — needs two pull requests, so `Closes` is
# unavailable there, which was the whole point.
#
# go-to-k/cdkd#3423 folded this set into one checklist issue, because 44 of the
# repository's 240 open issues were bot-filed slices of one campaign. That was
# reversed, without a parent this time: the one issue collected every claim,
# measurement and contributor question in a single thread, reached 117 comments
# and buried an outside contributor's exchange. The open-issue count is the
# accepted cost.
#
# The generated half is generated ALL the way down. Forty-four hand-maintained
# lists would be strictly worse than one, and hand creation reintroduces the bug
# `renderUmbrellaChecklist`'s doc comment records: an append-only list cannot
# express a type that was ticked off and later regained a property.
#
# This used to be a step inside `cfn-schema-refresh.yml`, and being there made
# it describe a state that need never exist. That job renders the checklist
# from its OWN post-refresh workspace and writes it before the refresh PR is
# reviewed, so closing that PR left the issue asserting properties `main` does
# not have: measured on 2026-09-07, the checklist listed 288 rows against
# `main`'s 285, and the three extra came from a dispatch whose PR (#2770) was
# closed unmerged. The staleness ran the other way too — a human
# merging a backfill PR that RETIRED entries left the old list standing until
# the next daily run.
#
# Driving it from `main` instead makes the issue reflect `main` by
# construction, whoever moved it and however: the daily refresh, a hand-written
# backfill, a revert. There is nothing to keep in step, because there is no
# second source.
#
# The path filter is exact rather than approximate. `parseSdkUnwiredByType` —
# the single parser behind both render modes — reads
# `src/provisioning/property-coverage.generated.ts` and nothing else, so that
# one path neither under-triggers (no other input can change the answer) nor
# over-triggers (a change to it always can).
name: Backfill issues sync

on:
  push:
    branches: [main]
    paths:
      - "src/provisioning/property-coverage.generated.ts"
  # The recovery path, not a convenience: every refusal below leaves the issue
  # untouched and asks a human to fix the label or the markers, and this is how
  # the sync is retried afterwards without waiting for the next coverage-map
  # change — which, on a quiet week, may not come.
  #
  # How and when to use it, and what it will NOT fix:
  # https://github.com/go-to-k/cdkd/blob/main/docs/schema-refresh-runbook.md
  # (linked HERE because this file is what a person opens when the job
  # misbehaves — and the runbook's only other inbound links are written by a
  # pull request that, in exactly that case, does not exist)
  workflow_dispatch:

permissions: {}

concurrency:
  group: backfill-issues-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    # observed at least 102 s. Walks the per-type issues through the GitHub
    # API, so it grows with the campaign.
    timeout-minutes: 20
    permissions:
      contents: read
      # The only write this job holds, and it reaches the per-type issues alone.
      # The refresh job needed `issues: write` for this same campaign; moving it
      # here is what lets that job drop it.
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          # `main`, whatever a dispatch or a re-run names: a closed issue is not
          # reopened, so another branch's map could close types irreversibly.
          ref: main
          # Nothing here pushes, so the token has no reason to persist into
          # `.git/config` where the render step's subprocesses could reach it.
          persist-credentials: false

      # No `vp install`. Every flag in `RENDER_ONLY_FLAGS` —
      # `--backfill-issues` here — returns before any of the refresh-report
      # setup and uses only `node:` builtins to read one committed file, and
      # `scripts/sync-backfill-issues.ts` imports nothing outside `node:`
      # either, so a dependency install would add a failure surface to two steps
      # that cannot use it.
      #
      # That was a true statement about what the mode CALLS and a false one
      # about what it LOADS, and the difference cost this workflow every run it
      # had: ESM resolves a module's WHOLE graph before any of its code runs,
      # so a static import of `offline-property-evidence.ts` reached
      # `typescript-v6` and the step died at load time on BOTH of the only two
      # runs since it landed (issue
      # https://github.com/go-to-k/cdkd/issues/2858). The helpers are loaded on
      # demand now, and `tests/unit/scripts/umbrella-checklist-no-deps.test.ts`
      # SPAWNS EVERY render-only mode against a corpus with no `node_modules` —
      # so the claim above is checked rather than asserted, for each mode rather
      # than for the one that happened to be wired when it was written. That test
      # also asserts THIS job still declares `run-install: false`, so adding an
      # install here does not quietly de-fang the fence: it fails it. Fix the
      # graph instead.
      - uses: voidzero-dev/setup-vp@cab1ab9eaff52d4857875f4f2c016e36af8f2c76 # v1
        with:
          node-version: "24"
          cache: true
          run-install: false

      # Rendered in a step holding NO token, the same split the refresh job
      # draws: this is repository code reading repository files, and the step
      # below is the one that can write.
      - name: Render the reconciliation plan from main's coverage map
        run: |
          set -euo pipefail
          node scripts/diagnose-schema-refresh.mjs --backfill-issues > /tmp/plan.json
          # SHAPE, not size. A size test looks like it covers a broken render
          # and does not: `diagnose-schema-refresh.mjs` wraps `main()` in a
          # catch that writes `_The automated diagnosis failed to run (…)_` to
          # STDOUT and exits 0, so a render throw produces a NON-EMPTY file
          # holding one error sentence -- which the reconciler would then read
          # as a document, on a green run. (The script also re-throws for every
          # flag in `RENDER_ONLY_FLAGS`, so this is the second of two
          # independent stops rather than the only one.)
          #
          # `jq -e` on the TYPE of `.types`, not on its length. "No types left"
          # and "this is not a plan" are different states and only the second is
          # a failure here: a finished campaign renders `{"types": []}` legally,
          # and the reconciler has its own, louder refusal for the case where
          # that empty array arrives while per-type issues are still open. A length
          # test here would make a genuinely finished campaign unrepresentable,
          # the same way accepting only rows once did for the flat checklist.
          jq -e '.types | type == "array"' /tmp/plan.json > /dev/null

      - name: Reconcile the per-type issues
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          # The label on the GENERATED per-type issues. `/work-issues` excludes
          # it from its backlog listing, so a hand-filed issue must never carry
          # it. Its spelling is fenced
          # against the script's `SUBISSUE_LABEL` and against the skill's
          # exclusion by `tests/unit/scripts/sync-backfill-issues.test.ts`.
          SUBISSUE_LABEL: backfill-type
        run: |
          set -euo pipefail
          # REGENERATE the campaign's issues from the coverage map, rather than
          # appending findings to them.
          #
          # Appending cannot express a type that was ticked off and later
          # regained a property: the `[x]` row stays checked and a second row
          # appears for the same type, so the reader sees one entry saying
          # "done" and another saying "not". Dedup does not fix that — the
          # append model is what is wrong. The map is the campaign's own stated
          # completion criterion, so rendering FROM it means a type's issue
          # is refiled when it regains a property and closes when it is finished,
          # with no hand-maintained state to go stale.
          #
          # Human provenance — claims, measurements, which PR closed which
          # slice — cannot be recomputed, and it lives in the issues' COMMENTS,
          # which nothing here writes.
          #
          # The per-type label has to EXIST before an issue can be created with
          # it, and `gh issue create --label` fails outright on an unknown one --
          # which on a first run is every creation. `--force` updates in place
          # rather than failing when it is already there, so this is idempotent
          # without a `|| true` that would also swallow a real permission error.
          gh label create "${SUBISSUE_LABEL}" --force \
            --color BFD4F2 \
            --description "Generated per-resource-type slice of the backfill campaign; do not hand-edit the body."

          # The reconciliation itself, and the only write this job makes. It
          # touches the generated per-type issues alone.
          #
          # Everything the reconciler refuses exits NON-ZERO and mutates nothing,
          # because every refusal inside the reconciler guards against WRITING
          # the wrong thing across ~44 public issues, where a green run that
          # changed nothing is not a notification.
          node scripts/sync-backfill-issues.ts /tmp/plan.json
