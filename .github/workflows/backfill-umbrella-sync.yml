# Keeps the backfill campaign's issues equal to what `main` says, by rendering
# them from `main` whenever `main`'s coverage map moves.
#
# "Issues", plural, since go-to-k/cdkd#2949: the campaign is a PARENT issue
# carrying prose, audit provenance and a per-type index, plus one generated
# SUB-ISSUE per resource type that still has silently-dropped properties. This
# job reconciles that set — creating, updating, reopening and closing — and then
# splices the index into the parent.
#
# The shape changed because a single 288-row checklist could not be LINKED to
# the work that advances it. A pull request wiring one type had nothing to
# `Closes`, since the umbrella has to stay open for the other 43 types, so the
# campaign was invisible to `Closes`, to `pr-inherit-issue-labels.yml` and to
# the `/work-issues` claim flow. At type granularity 25 of the 44 types hold 1-3
# properties, so a single pull request closes its issue outright for the
# majority. Service granularity was measured and rejected: RDS alone spans
# `DBInstance` (62), `DBCluster` (40) and others, and even DynamoDB — the
# smallest multi-provider service — needs two pull requests, so `Closes` is
# unavailable there, which was the whole point.
#
# The generated half is generated ALL the way down. Forty-four hand-maintained
# lists would be strictly worse than one, and hand creation reintroduces the bug
# `renderUmbrellaChecklist`'s doc comment records: an append-only list cannot
# express a type that was ticked off and later regained a property.
#
# This used to be a step inside `cfn-schema-refresh.yml`, and being there made
# it describe a state that need never exist. That job renders the checklist
# from its OWN post-refresh workspace and writes it before the refresh PR is
# reviewed, so closing that PR left the issue asserting properties `main` does
# not have: measured on 2026-09-07, the umbrella listed 288 rows against
# `main`'s 285, and the three extra came from a dispatch whose PR (#2770) was
# closed unmerged. The staleness ran the other way too — a human
# merging a backfill PR that RETIRED entries left the old list standing until
# the next daily run.
#
# Driving it from `main` instead makes the issue reflect `main` by
# construction, whoever moved it and however: the daily refresh, a hand-written
# backfill, a revert. There is nothing to keep in step, because there is no
# second source.
#
# The path filter is exact rather than approximate. `parseSilentDropByType` —
# the single parser behind both render modes — reads
# `src/provisioning/property-coverage.generated.ts` and nothing else, so that
# one path neither under-triggers (no other input can change the answer) nor
# over-triggers (a change to it always can).
name: Backfill umbrella sync

on:
  push:
    branches: [main]
    paths:
      - "src/provisioning/property-coverage.generated.ts"
  # The recovery path, not a convenience: every refusal below leaves the issue
  # untouched and asks a human to fix the label or the markers, and this is how
  # the sync is retried afterwards without waiting for the next coverage-map
  # change — which, on a quiet week, may not come.
  #
  # How and when to use it, and what it will NOT fix:
  # https://github.com/go-to-k/cdkd/blob/main/docs/schema-refresh-runbook.md
  # (linked HERE because this file is what a person opens when the job
  # misbehaves — and the runbook's only other inbound links are written by a
  # pull request that, in exactly that case, does not exist)
  workflow_dispatch:

permissions: {}

concurrency:
  group: backfill-umbrella-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # The only write this job holds. The refresh job needed `issues: write`
      # for this same splice; moving it here is what lets that job drop it.
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          # Nothing here pushes, so the token has no reason to persist into
          # `.git/config` where the render step's subprocesses could reach it.
          persist-credentials: false

      # No `vp install`. Every flag in `RENDER_ONLY_FLAGS` —
      # `--umbrella-subissues` here — returns before any of the refresh-report
      # setup and uses only `node:` builtins to read one committed file, and
      # `scripts/sync-backfill-subissues.ts` imports nothing outside `node:`
      # either, so a dependency install would add a failure surface to two steps
      # that cannot use it.
      #
      # That was a true statement about what the mode CALLS and a false one
      # about what it LOADS, and the difference cost this workflow every run it
      # had: ESM resolves a module's WHOLE graph before any of its code runs,
      # so a static import of `offline-property-evidence.ts` reached
      # `typescript-v6` and the step died at load time on BOTH of the only two
      # runs since it landed (issue
      # https://github.com/go-to-k/cdkd/issues/2858). The helpers are loaded on
      # demand now, and `tests/unit/scripts/umbrella-checklist-no-deps.test.ts`
      # SPAWNS EVERY render-only mode against a corpus with no `node_modules` —
      # so the claim above is checked rather than asserted, for each mode rather
      # than for the one that happened to be wired when it was written. That test
      # also asserts THIS job still declares `run-install: false`, so adding an
      # install here does not quietly de-fang the fence: it fails it. Fix the
      # graph instead.
      - uses: voidzero-dev/setup-vp@49c3e4e92c52e7f8392712a9267bbe71c5ab30e5 # v1
        with:
          node-version: "24"
          cache: true
          run-install: false

      # Rendered in a step holding NO token, the same split the refresh job
      # draws: this is repository code reading repository files, and the step
      # below is the one that can write.
      - name: Render the reconciliation plan from main's coverage map
        run: |
          set -euo pipefail
          node scripts/diagnose-schema-refresh.mjs --umbrella-subissues > /tmp/plan.json
          # SHAPE, not size. A size test looks like it covers a broken render
          # and does not: `diagnose-schema-refresh.mjs` wraps `main()` in a
          # catch that writes `_The automated diagnosis failed to run (…)_` to
          # STDOUT and exits 0, so a render throw produces a NON-EMPTY file
          # holding one error sentence -- which the reconciler would then read
          # as a document, on a green run. (The script also re-throws for every
          # flag in `RENDER_ONLY_FLAGS`, so this is the second of two
          # independent stops rather than the only one.)
          #
          # `jq -e` on the TYPE of `.types`, not on its length. "No types left"
          # and "this is not a plan" are different states and only the second is
          # a failure here: a finished campaign renders `{"types": []}` legally,
          # and the reconciler has its own, louder refusal for the case where
          # that empty array arrives while sub-issues are still open. A length
          # test here would make a genuinely finished campaign unrepresentable,
          # the same way accepting only rows once did for the flat checklist.
          jq -e '.types | type == "array"' /tmp/plan.json > /dev/null

      - name: Reconcile the per-type sub-issues, then index them in the umbrella
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          # The LABEL that marks the standing umbrella issue, not its number.
          # A number goes stale silently the moment the campaign moves, and it
          # did: the first destination carried months of design discussion and
          # participants beyond the maintainer, so a daily bot write notified
          # all of them. Moving it is now `gh issue edit --add-label`, and the
          # lookup below refuses to guess when the label is not on exactly one
          # open issue.
          BACKFILL_UMBRELLA_LABEL: backfill-umbrella
          # The label on the GENERATED per-type issues. Two distinct labels, and
          # the split is load-bearing in both directions: the lookup above must
          # find exactly ONE issue, so the sub-issues cannot share the umbrella's
          # label; and `/work-issues` excludes this one from its backlog listing,
          # so a hand-filed issue must never carry it. Its spelling is fenced
          # against the script's `SUBISSUE_LABEL` and against the skill's
          # exclusion by `tests/unit/scripts/sync-backfill-subissues.test.ts`.
          SUBISSUE_LABEL: backfill-type
          # The block this workflow OWNS in the umbrella body. Everything
          # outside it is human-written and never rewritten.
          MARKER_BEGIN: "<!-- BEGIN generated: remaining silent-drop properties -->"
          MARKER_END: "<!-- END generated -->"
        run: |
          set -euo pipefail
          # REGENERATE the umbrella's checklist from the coverage map, rather
          # than appending findings to it.
          #
          # Appending cannot express a type that was ticked off and later
          # regained a property: the `[x]` row stays checked and a second row
          # appears for the same type, so the reader sees one entry saying
          # "done" and another saying "not". Dedup does not fix that — the
          # append model is what is wrong. The map is the umbrella's own stated
          # completion criterion, so rendering FROM it means a type reappears
          # when it regains a property and disappears when it is finished, with
          # no hand-maintained state to go stale.
          #
          # Human provenance — which PR closed which slice — cannot be
          # recomputed, so it lives OUTSIDE the markers and is never touched.
          #
          # The STATUS is captured separately from the value, because "GitHub
          # did not answer" and "no issue carries the label" are different
          # outcomes that must not share one exit. A `|| true` here collapses
          # them: a transport error renders as "found 0", warns, and exits
          # GREEN -- and since this workflow fires on a push, nothing re-runs
          # it, so the umbrella silently stops tracking `main`. That is the
          # same green-run-that-changed-nothing this file refuses at the write.
          if ! umbrella_json=$(gh issue list --state open --limit 100 \
               --label "${BACKFILL_UMBRELLA_LABEL}" --json number); then
            echo "::error::Could not ask GitHub which issue carries '${BACKFILL_UMBRELLA_LABEL}'. This is a transport or permission failure, not an empty result — re-run this workflow once it is resolved."
            exit 1
          fi
          umbrella=$(printf '%s' "${umbrella_json}" | jq -r '[.[].number] | join(" ")')
          umbrella_count=$(printf '%s' "${umbrella}" | wc -w | tr -d ' ')

          if [ "${umbrella_count}" != "1" ]; then
            echo "::warning::Expected exactly one OPEN issue labelled '${BACKFILL_UMBRELLA_LABEL}', found ${umbrella_count} (${umbrella:-none}). Refusing to guess which issue to write. Label exactly one and re-run this workflow."
            exit 0
          fi

          # The sub-issue label has to EXIST before an issue can be created with
          # it, and `gh issue create --label` fails outright on an unknown one --
          # which on a first run is every creation. `--force` updates in place
          # rather than failing when it is already there, so this is idempotent
          # without a `|| true` that would also swallow a real permission error.
          gh label create "${SUBISSUE_LABEL}" --force \
            --color BFD4F2 \
            --description "Generated per-resource-type slice of the backfill campaign; do not hand-edit the body."

          # The reconciliation itself. Everything it refuses exits NON-ZERO and
          # mutates nothing -- unlike the label / marker refusals above, which
          # warn and exit 0. The asymmetry is deliberate and the script's header
          # argues it: those are states a human fixes and a stale list is the
          # cost, while every refusal inside the reconciler guards against
          # WRITING the wrong thing across ~44 public issues, where a green run
          # that changed nothing is not a notification.
          #
          # INDEX_OUT is the per-type index the splice below writes into the
          # parent. It is produced HERE, and not by the render step, because it
          # carries the sub-issue NUMBERS -- which do not exist until the
          # reconciliation has created them.
          PARENT="${umbrella}" INDEX_OUT=/tmp/index.md \
            node scripts/sync-backfill-subissues.ts /tmp/plan.json

          # The SECOND shape fence, on the index this time rather than the plan.
          # The first one (`jq -e` in the render step) attests to the reconciler's
          # INPUT; this attests to its OUTPUT, which is the thing about to be
          # written into a public issue. It is the flat checklist's old
          # rows-or-sentinel guard, re-pointed: an earlier revision of this change
          # dropped it on the reasoning that `jq` had replaced it, which was
          # wrong -- the two guard different files at different stages, and
          # `INDEX_OUT` is written by a code path `jq` never sees.
          #
          # Rows OR the finished-campaign sentinel, never rows alone: a genuinely
          # finished campaign renders the sentinel, and accepting only rows would
          # make that state unrepresentable -- the defect that once killed this
          # step under `set -e` with no annotation and left the umbrella's stale
          # rows standing permanently.
          grep -qE '^- \[ \] |^_No remaining silent-drop properties' /tmp/index.md || {
            echo "::error::The rendered index is neither rows nor the finished-campaign sentinel, so it was NOT spliced into umbrella #${umbrella}. The sub-issues are current; the parent is one run behind."
            exit 1
          }

          U=$(mktemp)
          # The chaining and the `-s` test are load-bearing, not style: the
          # redirect truncates the file BEFORE gh runs, so an unchained recipe
          # whose `view` fails would replace the umbrella's WHOLE body —
          # destroying the provenance section this design exists to preserve.
          # `tr -d '\r'` is not tidying. The markers are located with `grep -Fx`,
          # which demands a byte-exact whole line, and a body edited in the
          # GitHub WEB UI is stored with CRLF -- so the marker line is
          # `<!-- BEGIN ... -->\r` and matches nothing. Measured on this repo, 3
          # of the 100 most recent issue comments carry CR. Without the strip
          # the count guard below reports 0 and 0 and asks a human to "fix the
          # markers" that are already correct, forever -- and the recovery it
          # names, hand-editing the issue, is what CREATES the CRLF. It also
          # keeps the `cmp` idempotence test from seeing a phantom diff.
          # FAILS the run, unlike the marker-shape refusals below it. Two things
          # separate this case from those, and both point the same way. The
          # umbrella's number was just resolved from a successful listing, so a
          # read failure here is a transport or permission error by
          # construction, not a state a human has misconfigured -- the same
          # distinction the label lookup above draws, and collapsing it into one
          # `exit 0` is exactly what that lookup's own comment refuses. And it
          # lands AFTER the reconciler has already mutated the sub-issues, so a
          # green exit leaves the parent's index describing the set as it was
          # before this run, on a push-triggered workflow that nothing re-runs.
          if ! { gh issue view "${umbrella}" --json body -q .body | tr -d '\r' > "${U}" && [ -s "${U}" ]; }; then
            echo "::error::Could not read backfill umbrella #${umbrella}'s body after reconciling its sub-issues, so its index was NOT updated. The sub-issues are current; the parent is one run behind. Re-run this workflow once the issue is readable."
            exit 1
          fi

          # Located by LINE NUMBER, and each marker must appear exactly once on
          # a line of its own, with END after BEGIN. Presence alone is not
          # enough to splice safely: two BEGIN/END pairs leave a second
          # generated block that nothing ever updates, and END-before-BEGIN
          # duplicates the body on every run. `-Fx` also means a marker quoted
          # inside a human's prose is not mistaken for the real one.
          begin_line=$(grep -Fxn -- "${MARKER_BEGIN}" "${U}" | cut -d: -f1 || true)
          end_line=$(grep -Fxn -- "${MARKER_END}" "${U}" | cut -d: -f1 || true)
          begin_count=$(printf '%s' "${begin_line}" | wc -w | tr -d ' ')
          end_count=$(printf '%s' "${end_line}" | wc -w | tr -d ' ')
          if [ "${begin_count}" != "1" ] || [ "${end_count}" != "1" ]; then
            echo "::warning::Umbrella #${umbrella} must carry exactly one ${MARKER_BEGIN} line and one ${MARKER_END} line; found ${begin_count} and ${end_count}. There is nowhere to write the generated checklist without guessing which part of the body is generated. Fix the markers and re-run this workflow."
            exit 0
          fi
          if [ "${end_line}" -le "${begin_line}" ]; then
            echo "::warning::Umbrella #${umbrella} has ${MARKER_END} on line ${end_line}, at or before ${MARKER_BEGIN} on line ${begin_line}. Splicing that order would duplicate the body. Fix the markers and re-run this workflow."
            exit 0
          fi

          N=$(mktemp)
          # Everything up to and including BEGIN, the freshly rendered rows,
          # then END onward. Splicing rather than rewriting is what keeps the
          # human-owned half untouched.
          #
          # `head`/`tail` on the LINE NUMBERS above, not `sed` address ranges.
          # `sed -n '1,/re/p'` starts searching for addr2 at line TWO, so a
          # body whose first line is the BEGIN marker never closes the range:
          # the head half printed the WHOLE body, and the result grew by one
          # copy of the human provenance section on every push (measured). It
          # also needed the marker text regex-escaped, a second way to get this
          # wrong quietly.
          head -n "${begin_line}" "${U}" > "${N}"
          cat /tmp/index.md >> "${N}"
          tail -n "+${end_line}" "${U}" >> "${N}"

          if cmp -s "${U}" "${N}"; then
            echo "::notice::Umbrella #${umbrella} checklist is already current."
            exit 0
          fi
          # No `|| echo "::warning::"` on this one, unlike the refusals above.
          # Those are states a human has to fix and the run reports honestly;
          # this is the write itself, and a swallowed 403 here is the silent
          # watch failure the refresh job's own `issues: write` comment was
          # written about. A red run on `main` is a notification; a green run
          # that changed nothing is not.
          gh issue edit "${umbrella}" --body-file "${N}"
