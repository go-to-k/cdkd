# Keeps the backfill campaign's checklist equal to what `main` says, by
# rendering it from `main` whenever `main`'s coverage map moves.
#
# ONE issue: the campaign is a single umbrella (go-to-k/cdkd#2762) whose body
# carries a GENERATED BLOCK between `<!-- backfill-types:start -->` and
# `<!-- backfill-types:end -->`, one row per resource type that still has
# silently-dropped properties. This job rewrites that block, and nothing else on
# the page.
#
# go-to-k/cdkd#2949 had fanned the campaign into ~44 generated per-type SUB-ISSUES,
# which this job created, updated, reopened and closed. Measured afterwards: 44
# of the repository's 240 open issues were bot-filed slices of one campaign, and
# in a public open-issue count a generated slice is indistinguishable from a
# defect nobody has fixed. The per-type issues are closed (once, by hand:
# `REPO=<owner/repo> node scripts/sync-backfill-umbrella.ts --close-legacy`) and
# the `backfill-type` label is legacy — nothing generates it any more.
#
# What the fan-out bought, and what replaces it: a pull request wiring one type
# had nothing to `Closes`, since the umbrella has to stay open for the other 43
# types. It writes `Refs` and ticks nothing — the row for that type disappears on
# its own once the coverage map says the type is done, which is the same
# completion signal the sub-issue's auto-close used.
#
# The generated half is generated ALL the way down. Hand-maintaining the rows
# reintroduces the bug the renderer's doc comment records: an append-only list
# cannot express a type that was ticked off and later regained a property. The
# HUMAN half of the body — the audit provenance, the procedure, which pull
# request closed which slice — lives OUTSIDE the two markers and is carried
# through byte for byte; it cannot be recomputed, which is why the splice is
# delimited rather than the whole body being written.
#
# This used to be a step inside `cfn-schema-refresh.yml`, and being there made
# it describe a state that need never exist. That job renders the checklist
# from its OWN post-refresh workspace and writes it before the refresh PR is
# reviewed, so closing that PR left the issue asserting properties `main` does
# not have: measured on 2026-09-07, the umbrella listed 288 rows against
# `main`'s 285, and the three extra came from a dispatch whose PR (#2770) was
# closed unmerged. The staleness ran the other way too — a human
# merging a backfill PR that RETIRED entries left the old list standing until
# the next daily run.
#
# Driving it from `main` instead makes the issue reflect `main` by
# construction, whoever moved it and however: the daily refresh, a hand-written
# backfill, a revert. There is nothing to keep in step, because there is no
# second source.
#
# The path filter is exact rather than approximate. `parseSilentDropByType` —
# the single parser behind both render modes — reads
# `src/provisioning/property-coverage.generated.ts` and nothing else, so that
# one path neither under-triggers (no other input can change the answer) nor
# over-triggers (a change to it always can).
name: Backfill umbrella sync

on:
  push:
    branches: [main]
    paths:
      - "src/provisioning/property-coverage.generated.ts"
  # The recovery path, not a convenience: every refusal below leaves the issue
  # untouched and asks a human to fix the label or the markers, and this is how
  # the sync is retried afterwards without waiting for the next coverage-map
  # change — which, on a quiet week, may not come.
  #
  # How and when to use it, and what it will NOT fix:
  # https://github.com/go-to-k/cdkd/blob/main/docs/schema-refresh-runbook.md
  # (linked HERE because this file is what a person opens when the job
  # misbehaves — and the runbook's only other inbound links are written by a
  # pull request that, in exactly that case, does not exist)
  workflow_dispatch:

permissions: {}

concurrency:
  group: backfill-umbrella-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    # One issue read and at most one issue edit, plus the checkout.
    timeout-minutes: 20
    permissions:
      contents: read
      # The only write this job holds, and it reaches ONE issue body: the
      # generated block of the single open issue carrying the umbrella label.
      # The refresh job needed `issues: write` for this same campaign; moving it
      # here is what lets that job drop it.
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          # Nothing here pushes, so the token has no reason to persist into
          # `.git/config` where the render step's subprocesses could reach it.
          persist-credentials: false

      # No `vp install`. Every flag in `RENDER_ONLY_FLAGS` — `--umbrella-types`
      # here — returns before any of the refresh-report setup and uses only
      # `node:` builtins to read one committed file, and
      # `scripts/sync-backfill-umbrella.ts` imports nothing outside `node:` and
      # that same renderer, so a dependency install would add a failure surface
      # to two steps that cannot use it.
      #
      # That was a true statement about what the mode CALLS and a false one
      # about what it LOADS, and the difference cost this workflow every run it
      # had: ESM resolves a module's WHOLE graph before any of its code runs,
      # so a static import of `offline-property-evidence.ts` reached
      # `typescript-v6` and the step died at load time on BOTH of the only two
      # runs since it landed (issue
      # https://github.com/go-to-k/cdkd/issues/2858). The helpers are loaded on
      # demand now, and `tests/unit/scripts/umbrella-checklist-no-deps.test.ts`
      # SPAWNS EVERY render-only mode against a corpus with no `node_modules` —
      # so the claim above is checked rather than asserted, for each mode rather
      # than for the one that happened to be wired when it was written. That test
      # also asserts THIS job still declares `run-install: false`, so adding an
      # install here does not quietly de-fang the fence: it fails it. Fix the
      # graph instead.
      - uses: voidzero-dev/setup-vp@24d870228786dc83ae73482406bdd1e7befaec14 # v1
        with:
          node-version: "24"
          cache: true
          run-install: false

      # Rendered in a step holding NO token, the same split the refresh job
      # draws: this is repository code reading repository files, and the step
      # below is the one that can write.
      - name: Render the per-type plan from main's coverage map
        run: |
          set -euo pipefail
          node scripts/diagnose-schema-refresh.mjs --umbrella-types > /tmp/plan.json
          # SHAPE, not size. A size test looks like it covers a broken render
          # and does not: `diagnose-schema-refresh.mjs` wraps `main()` in a
          # catch that writes `_The automated diagnosis failed to run (…)_` to
          # STDOUT and exits 0, so a render throw produces a NON-EMPTY file
          # holding one error sentence -- which the reconciler would then read
          # as a document, on a green run. (The script also re-throws for every
          # flag in `RENDER_ONLY_FLAGS`, so this is the second of two
          # independent stops rather than the only one.)
          #
          # `jq -e` on the TYPE of `.types`, not on its length. "No types left"
          # and "this is not a plan" are different states and only the second is
          # a failure here: a finished campaign renders `{"types": []}` legally,
          # and the reconciler has its own, louder refusal for the case where
          # that empty array arrives while the published checklist still holds
          # rows. A length test here would make a genuinely finished campaign
          # unrepresentable, the same way accepting only rows once did.
          jq -e '.types | type == "array"' /tmp/plan.json > /dev/null

      - name: Rewrite the umbrella's generated checklist block
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          # The LABEL that marks the standing umbrella issue, not its number.
          # A number goes stale silently the moment the campaign moves, and it
          # did: the first destination carried months of design discussion and
          # participants beyond the maintainer, so a daily bot write notified
          # all of them. Moving it is now `gh issue edit --add-label`, and the
          # lookup below refuses to guess when the label is not on exactly one
          # open issue.
          BACKFILL_UMBRELLA_LABEL: backfill-umbrella
        run: |
          set -euo pipefail
          # REGENERATE the campaign's checklist from the coverage map, rather
          # than appending findings to it.
          #
          # Appending cannot express a type that was ticked off and later
          # regained a property: the `[x]` row stays checked and a second row
          # appears for the same type, so the reader sees one entry saying
          # "done" and another saying "not". Dedup does not fix that — the
          # append model is what is wrong. The map is the campaign's own stated
          # completion criterion, so rendering FROM it means a type's row
          # returns when it regains a property and disappears when it is
          # finished, with no hand-maintained state to go stale.
          #
          # Human provenance — which PR closed which slice — cannot be
          # recomputed, and it lives OUTSIDE the two markers, which the
          # reconciler never writes through.
          #
          # The STATUS is captured separately from the value, because "GitHub
          # did not answer" and "no issue carries the label" are different
          # outcomes that must not share one exit. A `|| true` here collapses
          # them: a transport error renders as "found 0", warns, and exits
          # GREEN -- and since this workflow fires on a push, nothing re-runs
          # it, so the campaign silently stops tracking `main`. That is the same
          # green-run-that-changed-nothing this file refuses at the
          # reconciliation below.
          if ! umbrella_json=$(gh issue list --state open --limit 100 \
               --label "${BACKFILL_UMBRELLA_LABEL}" --json number); then
            echo "::error::Could not ask GitHub which issue carries '${BACKFILL_UMBRELLA_LABEL}'. This is a transport or permission failure, not an empty result — re-run this workflow once it is resolved."
            exit 1
          fi
          umbrella=$(printf '%s' "${umbrella_json}" | jq -r '[.[].number] | join(" ")')
          umbrella_count=$(printf '%s' "${umbrella}" | wc -w | tr -d ' ')

          if [ "${umbrella_count}" != "1" ]; then
            echo "::warning::Expected exactly one OPEN issue labelled '${BACKFILL_UMBRELLA_LABEL}', found ${umbrella_count} (${umbrella:-none}). Refusing to guess which issue carries the campaign. Label exactly one and re-run this workflow."
            exit 0
          fi

          # The rewrite itself, and the only write this job makes. It is handed
          # the umbrella's NUMBER and nothing else: the region it rewrites is
          # delimited by the markers in the body, so everything a human wrote
          # around them survives unchanged.
          #
          # Everything the reconciler refuses exits NON-ZERO and mutates
          # nothing, unlike the label refusals above, which warn and exit 0. The
          # asymmetry is deliberate and the script's header argues it: those are
          # states a human fixes and a stale list is the cost, while every
          # refusal inside the reconciler guards against WRITING the wrong thing
          # onto the campaign's only public page, where a green run that changed
          # nothing is not a notification.
          PARENT="${umbrella}" node scripts/sync-backfill-umbrella.ts /tmp/plan.json
