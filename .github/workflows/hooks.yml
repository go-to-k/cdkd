name: Hook suites

# The `.claude/hooks/**` smoke tests. Kept out of `ci.yml` on purpose:
# they build throwaway git repos and take several minutes, and they are
# only interesting when a hook or its test changes — so this workflow is
# path-filtered instead of running on every push.
#
# Runs on macOS because that is the only runner image carrying bash 3.2
# (`/bin/bash`). The hooks are `#!/usr/bin/env bash`, so on a machine
# without a newer bash first on PATH they execute under 3.2, where bash 4+
# syntax (`mapfile`, `declare -A`, `${var^}`) is a runtime error. Issue
# #1458 shipped exactly that into the shared matcher, and issue #1477
# found `provider-integ-gate.test.sh` failing 3 of 17 cases there. A Linux
# runner would resolve both `bash` and `/bin/bash` to the same 5.x binary
# and prove nothing about that path.
on:
  push:
    branches: [main]
    paths:
      - '.claude/hooks/**'
      # settings.json is what REGISTERS the hooks, and
      # unresolved-target-class.test.sh derives its whole population from it.
      # Leaving it out meant go-to-k/cdkd#2380 (a settings-only respelling to
      # ${CLAUDE_PROJECT_DIR:-.}/...) emptied that population without ever
      # running this workflow; the breakage only surfaced on the next
      # unrelated hooks PR, 2026-08-29.
      - '.claude/settings.json'
      - '.github/workflows/hooks.yml'
  pull_request:
    branches: [main]
    paths:
      - '.claude/hooks/**'
      - '.claude/settings.json'
      - '.github/workflows/hooks.yml'

# Deny by default, then grant per job — see the same block in `ci.yml`. These
# two were the only workflows relying on the repository's
# `default_workflow_permissions` setting rather than declaring their own
# (issue go-to-k/cdkd#3229).
permissions: {}

jobs:
  hook-suites:
    runs-on: macos-latest
    # RAISED from 30, which was the one bound in the repository this change's
    # own standard condemned. Same closed range as every other bound here (see
    # `ci.yml`): n=49, median 1040 s, max 1587 s -- 26.5 minutes, against a
    # 30-minute bound. That is 1.1x, i.e. a real run had come within four
    # minutes of being killed.
    #
    # 45 was this PR's first answer and it was wrong for the same reason the
    # original 30 was: it came from a 12-run sample whose max was 1290 s, and a
    # small sample understates a tail. At n=49 the max is 1587 s and 45 gives
    # only 1.7x. 60 gives 2.3x, in line with the two `ci.yml` unit-suite jobs,
    # on the slowest and most variable host in the matrix -- a macOS runner
    # executing two bash suites.
    #
    # The bound predates this change and was never measured when written, which
    # is the argument for the fence rather than an exception to it: a bound
    # nobody re-derives drifts toward the work. Making the suite FASTER is the
    # better answer and is filed separately -- this job runs fork-authored bash
    # on a 10x-billed runner, so its ceiling is the one worth lowering, not
    # raising, once the suite allows it.
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6

      - name: Report available shells
        run: |
          echo "bash on PATH: $(command -v bash) -> $(bash -c 'echo $BASH_VERSION')"
          echo "/bin/bash:    $(/bin/bash -c 'echo $BASH_VERSION')"

      - run: bash .claude/hooks/run-tests.sh

      # The shared matcher's mutation harness. NOT picked up by run-tests.sh,
      # which globs `lib/*.test.sh`, so without this step nothing would run it
      # and it would be a fence exercised only by hand -- the shape
      # .claude/rules/hooks-class-fences.md records as "is anything RUNNING
      # it?". It exits non-zero when a mutant fails to reduce the pass count,
      # i.e. when a deliberate break goes unnoticed by every case.
      - name: Mutation harness for lib/command-match.sh
        run: bash .claude/hooks/lib/command-match-mutants.sh
